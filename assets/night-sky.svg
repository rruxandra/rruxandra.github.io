<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e24" />
      <stop offset="65%" stop-color="#192347" />
      <stop offset="100%" stop-color="#38446b" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131b36" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffce6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffe89e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffe89e" stop-opacity="0" />
    </radialGradient>
  </defs>

