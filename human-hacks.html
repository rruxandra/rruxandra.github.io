<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Hacks — the quiet miracle of what moves us</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:#05060a;color:#f4f1ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;}
  #bg{position:fixed;inset:0;z-index:0;}
  .wrap{position:relative;z-index:1;}

  .panel{min-height:100vh;display:flex;align-items:center;padding:8vh 7vw;}
  .panel .inner{max-width:620px;opacity:0;transform:translateY(40px);transition:opacity 1.1s ease,transform 1.1s ease;}
  .panel.in .inner{opacity:1;transform:none;}

  .num{font-size:12px;letter-spacing:0.35em;opacity:0.5;margin-bottom:22px;}
  h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;
     font-size:clamp(28px,5vw,54px);line-height:1.2;margin-bottom:22px;text-shadow:0 2px 30px rgba(0,0,0,0.55);}
  .body{font-size:clamp(15px,1.8vw,19px);line-height:1.78;font-weight:300;opacity:0.85;max-width:500px;}

  /* intro / outro centered */
  .center{justify-content:center;text-align:center;}
  .center .inner{max-width:680px;}
  .center h1{font-family:Georgia,serif;font-weight:400;font-style:italic;
     font-size:clamp(32px,6vw,66px);line-height:1.18;margin-bottom:24px;}
  .center h1 .sub{display:block;font-size:0.5em;opacity:0.78;margin-top:12px;line-height:1.3;}
  .center .body{margin:0 auto;}
  .scrollcue{margin-top:48px;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;opacity:0.5;
     animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:0.5;}50%{transform:translateY(8px);opacity:0.8;}}

  /* progress */
  #bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:5;
       background:linear-gradient(90deg,#f4d19a,#e88aa6,#9ab6f4);transition:width .1s linear;}
  #dots{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:5;
        display:flex;flex-direction:column;gap:12px;}
  #dots a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.22);transition:all .4s ease;}
  #dots a.active{background:#fff;transform:scale(1.5);}
  @media(max-width:640px){#dots{display:none;}.body{max-width:none;}}

  .back{position:fixed;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));z-index:10;
        display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
        background:rgba(10,12,18,0.42);border:1px solid rgba(244,241,234,0.16);
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        color:rgba(244,241,234,0.68);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;
        text-decoration:none;transition:color 0.25s ease,background 0.25s ease,border-color 0.25s ease;}
  .back:hover,.back:focus-visible{color:rgba(244,241,234,0.96);background:rgba(16,18,28,0.72);
        border-color:rgba(244,241,234,0.34);outline:none;}
  .back::before{content:"\2190";letter-spacing:0;}
</style>
</head>
<body>
<div id="bar"></div>
<a class="back" href="index.html">return to log</a>
<canvas id="bg"></canvas>
<nav id="dots"></nav>
<div class="wrap" id="wrap"></div>

<script>
/* ---------------- content ---------------- */
const scenes = [
  {key:'intro', intro:true,
   title:'Human Hacks<span class="sub">the quiet miracle of what moves us</span>',
   body:'Little keys each of us stumbles onto — a sound, a view, a word, a face — that quietly unlock something warm and steadying inside.'},

  {key:'music', label:'Music', top:'#1a1033', bottom:'#3b1d4e',
   title:'a song, and the mind ripples',
   body:'Certain sounds move through you like weather. You learn which ones to reach for when you need to feel something move again.'},

  {key:'ocean', label:'The Ocean', top:'#041b2e', bottom:'#0a3a4a',
   title:'the sea, and the breath slows',
   body:'Water arrives and leaves, arrives and leaves, and something in you remembers how to be unhurried. The worry gets smaller than the horizon.'},

  {key:'words', label:'Words', top:'#1d1406', bottom:'#3a2a10',
   title:'a word, and a world opens',
   body:'A few random letters and suddenly a whole place exists behind your eyes — a door you did not know was a door.'},

  {key:'stars', label:'The Stars', top:'#020311', bottom:'#0a1430',
   title:'the stars, and you grow pleasantly small',
   body:'You tip your head back and the ceiling of the world lifts away. Problems shrink to their true size under that much quiet light.'},

  {key:'love', label:'Someone Special', top:'#2a0a1c', bottom:'#4a1430',
   title:'a face, and the chest warms',
   body:'You think of one particular person and the hard day loosens its grip. A softness that makes the stressful hour survivable.'},

  {key:'snow', label:'Snow', top:'#0b1320', bottom:'#1a2a3e',
   title:'snow outside the glass, and inside feels safe',
   body:'Watching the cold fall quietly outside turns a room into a shelter. The hush alone can put you to sleep.'},

  {key:'fire', label:'Fire', top:'#1a0b05', bottom:'#2e1206',
   title:'a flame, and the thoughts go still',
   body:'Something ancient in you settles when you watch a fire. The mind empties out and just keeps watching it move.'},

  {key:'breath', label:'A Breath', top:'#04201c', bottom:'#0a3a32',
   title:'one slow breath, and the storm eases',
   body:'The oldest hack of all, always within reach. In through the circle, hold, out — and the racing quietly resolves.'},

  {key:'outro', intro:true, top:'#05060a', bottom:'#10131d',
   title:'and so many more,<br>waiting to be found'}
];

/* ---------------- build DOM ---------------- */
const wrap=document.getElementById('wrap');
scenes.forEach((s,i)=>{
  const p=document.createElement('section');
  p.className='panel'+(s.intro?' center':'');
  p.dataset.key=s.key;
  if(s.intro){
    p.innerHTML=`<div class="inner"><h1>${s.title}</h1>${s.body?`<p class="body">${s.body}</p>`:''}${i===0?'<div class="scrollcue">scroll ↓</div>':''}</div>`;
  }else{
    const n=String(i).padStart(2,'0');
    p.innerHTML=`<div class="inner"><div class="num">${n} / 08</div><h2>${s.title}</h2><p class="body">${s.body}</p></div>`;
  }
  wrap.appendChild(p);
});
const panels=[...document.querySelectorAll('.panel')];

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:0.3});
panels.forEach(p=>io.observe(p));

/* side dots */
const dotNav=document.getElementById('dots');
panels.forEach((p,i)=>{const a=document.createElement('a');a.onclick=()=>p.scrollIntoView();dotNav.appendChild(a);});
const dots=[...dotNav.children];

/* ---------------- canvas ---------------- */
const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initScene(curKey);
}
addEventListener('resize',resize);

const mouse={x:innerWidth/2,y:innerHeight/2,active:false};
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});
addEventListener('touchmove',e=>{if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;mouse.active=true;}},{passive:true});

/* palette lerp */
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
let curTop=[5,6,10], curBot=[11,13,22];
function toward(a,b,k){for(let i=0;i<3;i++)a[i]+=(b[i]-a[i])*k;}

/* scene state */
let curKey='intro';
let ripples=[],words=[],warmOrbs=[],warmRings=[],foam=[],sky=[],shooting=[],snow=[],embers=[],dust=[],bokeh=[];
const WORD_LIST=['ember','tide','orchard','hollow','lantern','drift','north','glass','bloom','marrow','feather','velvet','harbor','meadow','sonder','hush','willow','amber'];

function initScene(key){
  ripples=[];words=[];warmOrbs=[];warmRings=[];foam=[];shooting=[];snow=[];embers=[];bokeh=[];
  if(key==='stars'||key==='intro'||key==='outro'){
    sky=[];for(let i=0;i<160;i++)sky.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,tw:Math.random()*6.28,sp:0.01+Math.random()*0.04});
  }
  if(key==='words'){for(let i=0;i<10;i++)spawnWord(Math.random()*W,H+Math.random()*H*0.4);}
  if(key==='love'){for(let i=0;i<26;i++)warmOrbs.push(makeWarmOrb(true));}
  if(key==='snow'){for(let i=0;i<160;i++)snow.push(makeFlake(true));for(let i=0;i<6;i++)bokeh.push({x:Math.random()*W,y:Math.random()*H*0.7,r:35+Math.random()*65,ph:Math.random()*6});}
  if(key==='intro'||key==='outro'){dust=[];for(let i=0;i<50;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+0.3,ph:Math.random()*6,sp:0.1+Math.random()*0.3});}
}
function spawnWord(x,y){words.push({text:WORD_LIST[(Math.random()*WORD_LIST.length)|0],x,y,vy:-(0.15+Math.random()*0.35),size:14+Math.random()*26,alpha:0,maxA:0.35+Math.random()*0.5,drift:(Math.random()-0.5)*0.3,ph:Math.random()*6});}
function makeWarmOrb(spread){
  const big=Math.random()<0.35;
  return{x:Math.random()*W,y:spread?Math.random()*H:H+40+Math.random()*120,
    r:big?24+Math.random()*46:5+Math.random()*14,
    vy:-(0.15+Math.random()*0.35),sway:Math.random()*6.28,swaySpd:0.008+Math.random()*0.015,swayAmp:0.25+Math.random()*0.55,
    hue:12+Math.random()*34,a:big?0.06+Math.random()*0.09:0.18+Math.random()*0.28,ph:Math.random()*6.28};
}
function makeFlake(spread){
  const depth=Math.random();
  return{x:Math.random()*W,y:spread?Math.random()*H:-10-Math.random()*40,
    r:0.8+depth*3.6,sp:0.35+depth*1.15,sway:Math.random()*6.28,swaySpd:0.008+Math.random()*0.018,
    drift:(Math.random()-0.35)*0.25,a:0.22+depth*0.6,soft:depth>0.78};
}

/* ---------------- scene renderers ---------------- */
function sMusic(t){
  const cx=W/2,cy=H/2;
  if((frameN%48)===0)ripples.push({x:cx,y:cy,r:0,a:0.6,max:Math.max(W,H)*0.55});
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=2.4;r.a*=0.985;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.28);ctx.strokeStyle=`rgba(210,170,255,${r.a*0.5})`;ctx.lineWidth=1.5;ctx.stroke();
    if(r.r>r.max||r.a<0.01)ripples.splice(i,1);}
  const bars=72,inner=90;
  for(let i=0;i<bars;i++){const ang=(i/bars)*6.28;
    const osc=Math.sin(t*2.4+i*0.5)+Math.sin(t*1.3+i*0.9)+Math.sin(t*3.7+i*0.3);
    const len=40+(osc+3)/6*90;
    const x1=cx+Math.cos(ang)*inner,y1=cy+Math.sin(ang)*inner;
    const x2=cx+Math.cos(ang)*(inner+len),y2=cy+Math.sin(ang)*(inner+len);
    const g=ctx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,'rgba(255,150,230,0)');g.addColorStop(1,`rgba(190,140,255,${0.3+(osc+3)/6*0.4})`);
    ctx.strokeStyle=g;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
}
function sOcean(t){
  const mx=W*0.74,my=H*0.24;
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,110);
  mg.addColorStop(0,'rgba(230,240,255,0.85)');mg.addColorStop(0.5,'rgba(180,210,240,0.12)');mg.addColorStop(1,'rgba(180,210,240,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,110,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(245,250,255,0.9)';ctx.beginPath();ctx.arc(mx,my,30,0,6.28);ctx.fill();
  const L=[[0.62,18,0.004,0.6,'rgba(20,70,95,0.55)'],[0.70,26,0.006,0.9,'rgba(15,90,115,0.55)'],[0.80,34,0.009,1.3,'rgba(30,120,150,0.6)'],[0.90,22,0.013,1.8,'rgba(60,160,190,0.55)']];
  L.forEach(l=>{ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8){const y=H*l[0]+Math.sin(x*l[2]+t*l[3])*l[1]+Math.sin(x*l[2]*2.3+t*l[3]*0.7)*l[1]*0.4;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=l[4];ctx.fill();});
}
function sWords(t){
  if(Math.random()<0.03)spawnWord(Math.random()*W,H+20);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=words.length-1;i>=0;i--){const w=words[i];
    w.y+=w.vy;w.x+=Math.sin(t+w.ph)*w.drift;
    if(w.alpha<w.maxA&&w.y>H*0.2)w.alpha+=0.006;
    if(w.y<H*0.25)w.alpha-=0.004;
    ctx.font=`italic ${w.size}px Georgia, serif`;
    ctx.fillStyle=`rgba(255,228,170,${Math.max(0,w.alpha)})`;ctx.fillText(w.text,w.x,w.y);
    if(w.y<-40||w.alpha<=0)words.splice(i,1);}
}
function starfield(t,milky){
  if(milky){const g=ctx.createLinearGradient(0,H*0.2,W,H*0.8);
    g.addColorStop(0,'rgba(80,90,140,0)');g.addColorStop(0.5,'rgba(90,100,150,0.10)');g.addColorStop(1,'rgba(80,90,140,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  sky.forEach(s=>{s.tw+=s.sp;
    let tw=0.3+Math.sin(s.tw)*0.4;
    if(mouse.active){const d=Math.hypot(s.x-mouse.x,s.y-mouse.y);if(d<120)tw+=(1-d/120)*0.6;}
    ctx.globalAlpha=Math.min(1,Math.max(0,tw));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});
  ctx.globalAlpha=1;
}
function sStars(t){
  starfield(t,true);
  // drifting constellation lines near cursor
  if(mouse.active){
    const near=sky.filter(s=>Math.hypot(s.x-mouse.x,s.y-mouse.y)<160).slice(0,6);
    ctx.strokeStyle='rgba(180,200,255,0.25)';ctx.lineWidth=0.6;
    for(let i=0;i<near.length-1;i++){ctx.beginPath();ctx.moveTo(near[i].x,near[i].y);ctx.lineTo(near[i+1].x,near[i+1].y);ctx.stroke();}
  }
  // shooting stars
  if(Math.random()<0.012)shooting.push({x:Math.random()*W,y:Math.random()*H*0.5,vx:6+Math.random()*4,vy:2+Math.random()*2,life:1});
  for(let i=shooting.length-1;i>=0;i--){const s=shooting[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.02;
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*8,s.y-s.vy*8);
    g.addColorStop(0,`rgba(255,255,255,${s.life})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8);ctx.stroke();
    if(s.life<=0)shooting.splice(i,1);}
}
function sLove(t){
  const cx=W/2,cy=H*0.52;
  const breath=0.5+0.5*Math.sin(t*0.85);
  const rad=Math.min(W,H)*(0.38+breath*0.09);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  g.addColorStop(0,`rgba(255,190,140,${0.22+breath*0.10})`);
  g.addColorStop(0.45,`rgba(240,120,145,${0.10+breath*0.05})`);
  g.addColorStop(1,'rgba(220,90,130,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,6.28);ctx.fill();

  if((frameN%95)===0)warmRings.push({r:Math.min(W,H)*0.08,a:0.24,max:Math.min(W,H)*0.58});
  for(let i=warmRings.length-1;i>=0;i--){const ring=warmRings[i];
    ring.r+=0.9;ring.a*=0.988;
    ctx.beginPath();ctx.arc(cx,cy,ring.r,0,6.28);
    ctx.strokeStyle=`rgba(255,205,165,${ring.a})`;ctx.lineWidth=1.2;ctx.stroke();
    if(ring.r>ring.max||ring.a<0.006)warmRings.splice(i,1);
  }

  if(warmOrbs.length<28&&Math.random()<0.04)warmOrbs.push(makeWarmOrb(false));
  for(let i=warmOrbs.length-1;i>=0;i--){const o=warmOrbs[i];
    o.sway+=o.swaySpd;o.x+=Math.sin(o.sway)*o.swayAmp;o.y+=o.vy;
    let boost=0;
    if(mouse.active){const dx=mouse.x-o.x,dy=mouse.y-o.y,d=Math.hypot(dx,dy);
      if(d<220){o.x+=dx*0.0025;o.y+=dy*0.0025;boost=(1-d/220)*0.18;}}
    const a=Math.min(0.65,o.a*(0.75+0.25*Math.sin(t*1.2+o.ph))+boost);
    const og=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    og.addColorStop(0,`hsla(${o.hue},95%,84%,${a})`);
    og.addColorStop(0.5,`hsla(${o.hue-8},85%,68%,${a*0.45})`);
    og.addColorStop(1,`hsla(${o.hue-12},80%,58%,0)`);
    ctx.fillStyle=og;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.28);ctx.fill();
    if(o.y<-o.r*2){warmOrbs.splice(i,1);warmOrbs.push(makeWarmOrb(false));}
  }
}
function sSnow(t){
  bokeh.forEach(b=>{const a=0.06+Math.sin(t*0.7+b.ph)*0.025;const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,`rgba(255,215,160,${a})`);g.addColorStop(1,'rgba(255,215,160,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();});
  snow.forEach(f=>{
    f.sway+=f.swaySpd;
    f.y+=f.sp;
    f.x+=Math.sin(f.sway)*0.45+f.drift;
    if(mouse.active){const dx=f.x-mouse.x,dy=f.y-mouse.y,d=Math.hypot(dx,dy);if(d<110&&d>1){f.x+=(dx/d)*0.4;}}
    if(f.y>H+10){f.y=-10;f.x=Math.random()*W;}
    if(f.x>W+15)f.x=-15;if(f.x<-15)f.x=W+15;
    if(f.soft){
      const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*2.2);
      fg.addColorStop(0,`rgba(235,245,255,${f.a*0.85})`);fg.addColorStop(1,'rgba(235,245,255,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r*2.2,0,6.28);ctx.fill();
    }else{
      ctx.fillStyle=`rgba(235,245,255,${f.a})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fill();
    }
  });
}
function sFire(t){
  const bx=W/2,by=H*0.78;
  const g=ctx.createRadialGradient(bx,by,0,bx,by,Math.min(W,H)*0.5);
  g.addColorStop(0,`rgba(255,140,40,${0.18+Math.sin(t*8)*0.03})`);g.addColorStop(0.4,'rgba(200,70,20,0.07)');g.addColorStop(1,'rgba(120,30,10,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(embers.length<90&&Math.random()<0.6)embers.push({x:bx+(Math.random()-0.5)*120,y:by,vx:(Math.random()-0.5)*0.6,vy:-(1+Math.random()*2),life:1,r:1+Math.random()*2.2});
  for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.x+=e.vx+Math.sin(t*3+e.y*0.02)*0.4;e.y+=e.vy;e.vy*=0.99;e.life-=0.008;
    ctx.fillStyle=`rgba(255,${120+Math.random()*80|0},40,${Math.max(0,e.life)})`;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.28);ctx.fill();
    if(e.life<=0||e.y<0)embers.splice(i,1);}
}
function sBreath(t){
  const cyc=11,p=(t%cyc)/cyc;let r,label;
  const base=Math.min(W,H);
  if(p<0.36){const k=p/0.36;r=0.12+ease(k)*0.18;label='breathe in';}
  else if(p<0.5){r=0.30;label='hold';}
  else if(p<0.86){const k=(p-0.5)/0.36;r=0.30-ease(k)*0.18;label='breathe out';}
  else{r=0.12;label='rest';}
  const cx=W/2,cy=H/2,rad=base*r;
  for(let i=4;i>=1;i--){ctx.beginPath();ctx.arc(cx,cy,rad*(i/3),0,6.28);ctx.strokeStyle=`rgba(120,220,200,${0.12/i})`;ctx.lineWidth=1.5;ctx.stroke();}
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  g.addColorStop(0,'rgba(120,230,205,0.22)');g.addColorStop(1,'rgba(120,230,205,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(220,255,245,0.55)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='300 18px system-ui';ctx.fillText(label.toUpperCase(),cx,cy);
}
function ease(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
function sAmbient(t){
  starfield(t,false);
  dust.forEach(d=>{d.y-=d.sp;if(d.y<0)d.y=H;ctx.globalAlpha=0.15+Math.sin(t+d.ph)*0.15;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();});
  ctx.globalAlpha=1;
}

/* ---------------- loop ---------------- */
let frameN=0;
function activePanel(){
  let best=0,bd=1e9;
  panels.forEach((p,i)=>{const r=p.getBoundingClientRect();const c=r.top+r.height/2;const d=Math.abs(c-H/2);if(d<bd){bd=d;best=i;}});
  return best;
}
function frame(now){
  requestAnimationFrame(frame);frameN++;
  const t=now/1000;
  const ai=activePanel();
  const s=scenes[ai];
  dots.forEach((d,i)=>d.classList.toggle('active',i===ai));
  document.getElementById('bar').style.width=(scrollY/(document.body.scrollHeight-H)*100)+'%';

  if(s.key!==curKey){curKey=s.key;initScene(curKey);}
  const tt=s.top?hex(s.top):[5,6,10], tb=s.bottom?hex(s.bottom):[11,13,22];
  toward(curTop,tt,0.05);toward(curBot,tb,0.05);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${curTop.map(Math.round).join(',')})`);
  g.addColorStop(1,`rgb(${curBot.map(Math.round).join(',')})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  switch(curKey){
    case'music':sMusic(t);break;case'ocean':sOcean(t);break;case'words':sWords(t);break;
    case'stars':sStars(t);break;case'love':sLove(t);break;case'snow':sSnow(t);break;
    case'fire':sFire(t);break;case'breath':sBreath(t);break;default:sAmbient(t);
  }
  mouse.active=false;
}
resize();
requestAnimationFrame(frame);
</script>
