  /* ==========================================================================
   * 6. CAMERA MATH & PROJECTION (SHARED BY WEBGL2 AND 2D FX OVERLAY)
   * ========================================================================== */
  function vecNorm(v) {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  function vecCross(a, b) {
    return [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
  }

  function vecDot(a, b) {
    return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  }

  function updateCamera() {
    const pitch = cam.pitchDeg * Math.PI / 180;
    const tanH = cam.tanHalfFov;
    const aspect = cam.aspect;

    // Fit entire wooden timber box cleanly inside viewport
    const totalW = world.bedW + world.frameW * 2.0;
    const totalH = world.bedH + world.frameW * 2.0;
    const sinP = Math.sin(pitch);
    const cosP = Math.cos(pitch);

    // Compute exact distance so the garden fills ~94% of viewport beautifully
    const fill = state.verandaView ? 0.90 : 0.955;
    const distV = (totalH * 0.5 * sinP) / (tanH * fill) + (totalH * 0.5 * cosP);
    const distH = (totalW * 0.5) / (tanH * aspect * fill);
    const dist = Math.max(distV, distH);

    // Slight vertical framing offset so bottom dock leaves garden nicely centered
    const yBias = state.verandaView ? -4.5 : -2.2;
    cam.target = [0, yBias, 0];
    cam.pos = [0, yBias - dist * cosP, dist * sinP];
    cam.forward = vecNorm([
      cam.target[0] - cam.pos[0],
      cam.target[1] - cam.pos[1],
      cam.target[2] - cam.pos[2]
    ]);
    cam.right = vecNorm(vecCross(cam.forward, [0, 0, 1]));
    cam.up = vecCross(cam.right, cam.forward);
  }

  function screenToWorld(clientX, clientY, planeZ = 0) {
    const ndcX = (clientX / world.viewW) * 2 - 1;
    const ndcY = 1 - (clientY / world.viewH) * 2;
    const sx = ndcX * cam.aspect * cam.tanHalfFov;
    const sy = ndcY * cam.tanHalfFov;
    const rd = vecNorm([
      cam.forward[0] + cam.right[0] * sx + cam.up[0] * sy,
      cam.forward[1] + cam.right[1] * sx + cam.up[1] * sy,
      cam.forward[2] + cam.right[2] * sx + cam.up[2] * sy
    ]);
    const t = (planeZ - cam.pos[2]) / (rd[2] || -1e-4);
    return [cam.pos[0] + rd[0] * t, cam.pos[1] + rd[1] * t];
  }

  function worldToScreen(wx, wy, wz = 0) {
    const vx = wx - cam.pos[0];
    const vy = wy - cam.pos[1];
    const vz = wz - cam.pos[2];
    const cz = vx * cam.forward[0] + vy * cam.forward[1] + vz * cam.forward[2];
    if (cz <= 1) return [-9999, -9999, 1];
    const cx = vx * cam.right[0] + vy * cam.right[1] + vz * cam.right[2];
    const cy = vx * cam.up[0] + vy * cam.up[1] + vz * cam.up[2];
    const ndcX = cx / (cz * cam.aspect * cam.tanHalfFov);
    const ndcY = cy / (cz * cam.tanHalfFov);
    const px = (ndcX * 0.5 + 0.5) * world.viewW;
    const py = (0.5 - ndcY * 0.5) * world.viewH;
    // Pixels per cm at this depth
    const pxPerCm = (world.viewH * 0.5) / (cz * cam.tanHalfFov);
    return [px, py, pxPerCm];
  }

  function getSunDir() {
    const az = state.sunAzimuth * Math.PI / 180;
    const el = state.sunElevation * Math.PI / 180;
    const ce = Math.cos(el);
    return [Math.cos(az) * ce, Math.sin(az) * ce, Math.sin(el)];
  }

  /* ==========================================================================
   * 7. GPU SIMULATION PASSES
   * ========================================================================== */
  function swapSand() {
    const tmp = sandA;
    sandA = sandB;
    sandB = tmp;
  }

  function runRelaxPasses(count, rate = 0.16) {
    gl.useProgram(progRelax);
    gl.viewport(0, 0, world.simW, world.simH);
    gl.uniform2f(uRelax.uBedSize, world.bedW, world.bedH);
    gl.uniform2f(uRelax.uTexel, 1 / world.simW, 1 / world.simH);
    gl.uniform1f(uRelax.uRate, rate);
    gl.uniform1i(uRelax.uSandTex, 0);

    for (let i = 0; i < count; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, sandB.fbo);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sandA.tex);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      swapSand();
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function applyPreset(name, saveUndo = false) {
    if (saveUndo) pushUndoSnapshot();
    state.preset = name;
    state.stones = buildPresetStones(name);
    packStoneUniforms();

    const presetIdx = name === 'ryoanji' ? 0 : name === 'sazanami' ? 1 : name === 'uzumaki' ? 2 : 3;
    gl.useProgram(progPreset);
    gl.viewport(0, 0, world.simW, world.simH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sandA.fbo);
    gl.uniform2f(uPreset.uBedSize, world.bedW, world.bedH);
    gl.uniform1i(uPreset.uPreset, presetIdx);
    gl.uniform1i(uPreset.uStoneCount, state.stones.length);
    gl.uniform4fv(uPreset.uStoneA, stoneBufA);
    gl.uniform4fv(uPreset.uStoneB, stoneBufB);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    // Relax initial ridges into crisp physical angle-of-repose geometry
    runRelaxPasses(14, 0.17);
    state.settleFrames = 6;
    initMapleLeaves();
  }

  function runRakeStep(opts) {
    packStoneUniforms();
    gl.useProgram(progRake);
    gl.viewport(0, 0, world.simW, world.simH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sandB.fbo);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sandA.tex);

    gl.uniform1i(uRake.uSandTex, 0);
    gl.uniform2f(uRake.uBedSize, world.bedW, world.bedH);
    gl.uniform2f(uRake.uP0, opts.p0[0], opts.p0[1]);
    gl.uniform2f(uRake.uP1, opts.p1[0], opts.p1[1]);
    gl.uniform2f(uRake.uN0, opts.n0[0], opts.n0[1]);
    gl.uniform2f(uRake.uN1, opts.n1[0], opts.n1[1]);
    gl.uniform1i(uRake.uMode, opts.mode);
    gl.uniform1i(uRake.uTineCount, opts.tines || 1);
    gl.uniform1f(uRake.uSpacing, opts.spacing || 0);
    gl.uniform1f(uRake.uHalfW, opts.halfW || 1);
    gl.uniform1f(uRake.uDepth, opts.depth || 1);
    gl.uniform1f(uRake.uStrength, opts.strength ?? 0.85);
    gl.uniform1f(uRake.uTime, performance.now() * 0.001);
    gl.uniform1i(uRake.uStoneCount, state.stones.length);
    gl.uniform4fv(uRake.uStoneA, stoneBufA);
    gl.uniform4fv(uRake.uStoneB, stoneBufB);
    gl.uniform1i(uRake.uActiveStone, opts.activeStone ?? -1);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    swapSand();
  }

  /* ==========================================================================
   * 8. PROCEDURAL GRANULAR WEB AUDIO ENGINE (GRAVEL FOLEY + KYOTO AMBIENCE)
   * ========================================================================== */
  const audio = {
    ctx: null,
    master: null,
    initialized: false,
    rakeGain: null,
    rakeFilter: null,
    gritGain: null,
    gritFilter: null,
    woodGain: null,
    woodFilter: null,
    breezeGain: null,
    breezeFilter: null,
    rainGain: null,
    rainFilter: null,
    targetRakeAmp: 0,
    curRakeAmp: 0,
    lastClickMs: 0,
    nextShishiMs: 0
  };

  function createNoiseBuffer(ctx, seconds = 3.0, type = 'white') {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === 'pink') {
          b0 = 0.99765 * b0 + w * 0.0990460;
          b1 = 0.96300 * b1 + w * 0.2965164;
          b2 = 0.57000 * b2 + w * 1.0526913;
          data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.15;
        } else if (type === 'gravel') {
          // Sparse sharp granular micro-impulses (simulates individual Shirakawa pebbles clicking)
          const r = Math.random();
          data[i] = r < 0.055 ? (Math.random() * 2 - 1) * Math.pow(Math.random(), 0.45) : w * 0.07;
        } else {
          data[i] = w;
        }
      }
    }
    return buf;
  }

  function initAudio() {
    if (audio.initialized) {
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

    try {
      const ctx = new AC();
      audio.ctx = ctx;

      const master = ctx.createGain();
      master.gain.value = state.audioEnabled ? 0.72 : 0.0;
      master.connect(ctx.destination);
      audio.master = master;

      const pinkBuf   = createNoiseBuffer(ctx, 4.0, 'pink');
      const gravelBuf = createNoiseBuffer(ctx, 3.0, 'gravel');
      const whiteBuf  = createNoiseBuffer(ctx, 2.5, 'white');

      // Layer 1: Continuous broad sand displacement friction
      const rakeSrc = ctx.createBufferSource();
      rakeSrc.buffer = pinkBuf;
      rakeSrc.loop = true;
      const rakeFilter = ctx.createBiquadFilter();
      rakeFilter.type = 'bandpass';
      rakeFilter.frequency.value = 1350;
      rakeFilter.Q.value = 1.1;
      const rakeGain = ctx.createGain();
      rakeGain.gain.value = 0;
      rakeSrc.connect(rakeFilter).connect(rakeGain).connect(master);
      rakeSrc.start();
      audio.rakeFilter = rakeFilter;
      audio.rakeGain = rakeGain;

      // Layer 2: Crisp individual crushed-granite grain crackle
      const gritSrc = ctx.createBufferSource();
      gritSrc.buffer = gravelBuf;
      gritSrc.loop = true;
      const gritFilter = ctx.createBiquadFilter();
      gritFilter.type = 'bandpass';
      gritFilter.frequency.value = 3800;
      gritFilter.Q.value = 1.6;
      const gritGain = ctx.createGain();
      gritGain.gain.value = 0;
      gritSrc.connect(gritFilter).connect(gritGain).connect(master);
      gritSrc.start();
      audio.gritFilter = gritFilter;
      audio.gritGain = gritGain;

      // Layer 3: Subtle warm wooden rake body resonance
      const woodSrc = ctx.createBufferSource();
      woodSrc.buffer = pinkBuf;
      woodSrc.loop = true;
      const woodFilter = ctx.createBiquadFilter();
      woodFilter.type = 'bandpass';
      woodFilter.frequency.value = 340;
      woodFilter.Q.value = 3.2;
      const woodGain = ctx.createGain();
      woodGain.gain.value = 0;
      woodSrc.connect(woodFilter).connect(woodGain).connect(master);
      woodSrc.start();
      audio.woodFilter = woodFilter;
      audio.woodGain = woodGain;

      // Ambient Layer A: Distant gentle Kyoto bamboo breeze
      const breezeSrc = ctx.createBufferSource();
      breezeSrc.buffer = pinkBuf;
      breezeSrc.loop = true;
      const breezeFilter = ctx.createBiquadFilter();
      breezeFilter.type = 'bandpass';
      breezeFilter.frequency.value = 520;
      breezeFilter.Q.value = 0.85;
      const breezeGain = ctx.createGain();
      breezeGain.gain.value = 0.022;
      breezeSrc.connect(breezeFilter).connect(breezeGain).connect(master);
      breezeSrc.start();
      audio.breezeFilter = breezeFilter;
      audio.breezeGain = breezeGain;

      // Ambient Layer B: Soft Kyoto rain patter (audible in Mist mode)
      const rainSrc = ctx.createBufferSource();
      rainSrc.buffer = whiteBuf;
      rainSrc.loop = true;
      const rainFilter = ctx.createBiquadFilter();
      rainFilter.type = 'bandpass';
      rainFilter.frequency.value = 1800;
      rainFilter.Q.value = 0.65;
      const rainGain = ctx.createGain();
      rainGain.gain.value = 0.0;
      rainSrc.connect(rainFilter).connect(rainGain).connect(master);
      rainSrc.start();
      audio.rainFilter = rainFilter;
      audio.rainGain = rainGain;

      audio.initialized = true;
      audio.nextShishiMs = performance.now() + 18000 + Math.random() * 18000;
    } catch (_) {}
  }

  function triggerGrainTick(volume = 0.08, pitch = 4200) {
    if (!audio.initialized || !state.audioEnabled) return;
    const ctx = audio.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(pitch * (0.85 + Math.random() * 0.35), now);
    osc.frequency.exponentialRampToValueAtTime(pitch * 0.38, now + 0.018);
    g.gain.setValueAtTime(volume, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.022);
    osc.connect(g).connect(audio.master);
    osc.start(now);
    osc.stop(now + 0.026);
  }

  function triggerStoneThud(intensity = 0.4) {
    if (!audio.initialized || !state.audioEnabled) return;
    const ctx = audio.ctx;
    const now = ctx.currentTime;
    // Deep damped granite-into-gravel thud
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(92, now);
    osc.frequency.exponentialRampToValueAtTime(36, now + 0.16);
    g.gain.setValueAtTime(0.22 * intensity, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
    osc.connect(g).connect(audio.master);
    osc.start(now);
    osc.stop(now + 0.21);

    // Settling gravel trickle
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        triggerGrainTick(0.032 * intensity * (1 - i / 7), 2600 + Math.random() * 2600);
      }, 28 + i * 28 + Math.random() * 20);
    }
  }

  function triggerShishiOdoshi() {
    // Distant hollow bamboo water clack — quiet Kyoto temple atmosphere
    if (!audio.initialized || !state.audioEnabled) return;
    const ctx = audio.ctx;
    const now = ctx.currentTime;
    const freqs = [395, 810, 1480];
    const gains = [0.042, 0.022, 0.009];
    freqs.forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 0.96, now + 0.14);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(gains[idx], now + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18 - idx * 0.03);
      osc.connect(g).connect(audio.master);
      osc.start(now);
      osc.stop(now + 0.20);
    });
  }

  function updateAudio(nowMs, dt) {
    if (!audio.initialized) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime;

    const targetMaster = state.audioEnabled ? 0.72 : 0.0;
    audio.master.gain.setTargetAtTime(targetMaster, t, 0.12);
    if (!state.audioEnabled) return;

    // Smooth breeze breathing
    const breezeMod = 0.014 + 0.011 * Math.sin(nowMs * 0.00042) * Math.sin(nowMs * 0.00019 + 1.2);
    audio.breezeGain.gain.setTargetAtTime(breezeMod, t, 0.25);
    audio.breezeFilter.frequency.setTargetAtTime(460 + 220 * Math.sin(nowMs * 0.00031), t, 0.35);

    // Rain ambience in Mist preset
    const rainLevel = state.curWetness > 0.2 ? 0.048 * state.curWetness : 0.0;
    audio.rainGain.gain.setTargetAtTime(rainLevel, t, 0.45);

    // Active rake / sweeper / stone-drag gravel foley
    let speedNorm = 0;
    let tone = TOOLS[state.tool].audioTone;
    if (state.sweepActive) {
      speedNorm = 0.55;
      tone = 0.62;
    } else if (state.pointerDown && state.strokeSpeed > 0.4) {
      speedNorm = Math.min(1.0, state.strokeSpeed / 120.0);
    }

    audio.curRakeAmp += (speedNorm - audio.curRakeAmp) * Math.min(1, dt * 16);
    const amp = audio.curRakeAmp;

    const isSmooth = state.tool === 'smooth' || state.sweepActive;
    const isStone = state.tool === 'stone' && state.grabbedStone >= 0;

    audio.rakeGain.gain.setTargetAtTime(amp * (isSmooth ? 0.16 : 0.24), t, 0.03);
    audio.rakeFilter.frequency.setTargetAtTime((950 + amp * 1350) * tone, t, 0.04);

    audio.gritGain.gain.setTargetAtTime(amp * (isSmooth ? 0.09 : (isStone ? 0.28 : 0.36)), t, 0.025);
    audio.gritFilter.frequency.setTargetAtTime((2800 + amp * 2400) * Math.sqrt(tone), t, 0.04);

    audio.woodGain.gain.setTargetAtTime(amp * (isStone ? 0.18 : 0.11), t, 0.035);
    audio.woodFilter.frequency.setTargetAtTime(isStone ? 170 : 320 * tone, t, 0.05);

    // Occasional stochastic crisp pebble clicks while slowly raking
    if (amp > 0.04 && nowMs - audio.lastClickMs > (42 - amp * 24)) {
      audio.lastClickMs = nowMs;
      if (Math.random() < 0.55) {
        triggerGrainTick(0.015 + amp * 0.025, (3200 + Math.random() * 2800) * Math.sqrt(tone));
      }
    }

    // Rare distant bamboo shishi-odoshi water clack for Kyoto sanctuary feel
    if (nowMs > audio.nextShishiMs) {
      audio.nextShishiMs = nowMs + 32000 + Math.random() * 28000;
      if (!state.pointerDown) triggerShishiOdoshi();
    }
  }

  /* ==========================================================================
   * 9. 2D MICRO-DYNAMICS OVERLAY: KICKED GRAVEL GRAINS, MAPLE LEAVES, RAKE GHOST
   * ========================================================================== */
  const MAX_GRAINS = 320;
  const grains = [];

  function spawnKickedGrains(wx, wy, dirX, dirY, speed, count) {
    const perpX = -dirY;
    const perpY = dirX;
    const spd = Math.min(speed, 180);
    const tones = [
      '#e5dfd4', '#dcd5c7', '#cfc5b4', '#a7a197', '#4e4b46'
    ];
    for (let i = 0; i < count; i++) {
      if (grains.length >= MAX_GRAINS) grains.shift();
      const side = (Math.random() < 0.5 ? -1 : 1);
      const lat = (0.35 + Math.random() * 0.9) * side;
      const ejectSpd = (12 + spd * 0.24) * (0.55 + Math.random() * 0.85);
      const rPick = Math.random();
      const col = rPick > 0.86 ? tones[4] : rPick > 0.68 ? tones[3] : rPick > 0.42 ? tones[2] : rPick > 0.20 ? tones[1] : tones[0];
      grains.push({
        x: wx + (Math.random() - 0.5) * 1.4,
        y: wy + (Math.random() - 0.5) * 1.4,
        z: 0.4 + Math.random() * 0.8,
        vx: (perpX * lat + dirX * (0.25 + Math.random() * 0.5)) * ejectSpd,
        vy: (perpY * lat + dirY * (0.25 + Math.random() * 0.5)) * ejectSpd,
        vz: 14 + Math.random() * 22 + spd * 0.09,
        size: 0.14 + Math.random() * 0.16, // cm
        col,
        bounces: 0,
        life: 0.55 + Math.random() * 0.45,
        age: 0
      });
    }
  }

  // Delicate Japanese Maple Leaves (Acer palmatum / Momiji) resting & drifting across sand
  const mapleLeaves = [];

  function pushPointOutOfStones(x, y, pad = 4.2) {
    let px = x;
    let py = y;
    for (let i = 0; i < state.stones.length; i++) {
      const s = state.stones[i];
      const rad = s.r * Math.max(s.ax, s.ay) + pad;
      const dx = px - s.x;
      const dy = py - s.y;
      const d = Math.hypot(dx, dy);
      if (d < rad) {
        const ang = d > 0.01 ? Math.atan2(dy, dx) : (i * 1.9 + 0.5);
        px = s.x + Math.cos(ang) * (rad + 1.5);
        py = s.y + Math.sin(ang) * (rad + 1.5);
      }
    }
    return [px, py];
  }

  function createMapleLeaf(airborne = false) {
    const hw = world.bedW * 0.44;
    const hh = world.bedH * 0.44;
    const palettes = [
      ['#9f2b1f', '#721b13', '#c84b31'], // deep crimson momiji
      ['#b84222', '#822813', '#d96934'], // burnt vermilion
      ['#a85c24', '#703a14', '#cf8638'], // autumn amber
      ['#8b2620', '#5a1612', '#b03c2c']  // dark temple maple
    ];
    const pal = palettes[(Math.random() * palettes.length) | 0];
    let lx = (Math.random() * 2 - 1) * hw;
    let ly = (Math.random() * 2 - 1) * hh;
    // Keep resting leaves near outer half & clearly off stone silhouettes
    if (!airborne) {
      if (Math.hypot(lx / hw, ly / hh) < 0.48) {
        lx = (lx >= 0 ? 1 : -1) * hw * (0.55 + Math.random() * 0.36);
      }
      [lx, ly] = pushPointOutOfStones(lx, ly, 5.0);
    }
    return {
      x: airborne ? -hw - 15 : lx,
      y: airborne ? (Math.random() * 1.6 - 0.8) * hh : ly,
      z: airborne ? 45 + Math.random() * 35 : 0.22,
      vx: airborne ? 11 + Math.random() * 8 : 0,
      vy: airborne ? (Math.random() - 0.5) * 6 : 0,
      vz: airborne ? -5.5 - Math.random() * 3.5 : 0,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 2.2,
      tilt: Math.random() * Math.PI * 2,
      size: 2.9 + Math.random() * 1.15, // cm radius (~6-8cm real momiji leaf)
      pal,
      phase: Math.random() * 10
    };
  }

  function initMapleLeaves() {
    mapleLeaves.length = 0;
    const count = 4;
    for (let i = 0; i < count; i++) {
      mapleLeaves.push(createMapleLeaf(false));
    }
  }

  function nudgeLeavesFromRake(wx, wy, dirX, dirY, radius, speed) {
    if (!state.leavesOn) return;
    for (const lf of mapleLeaves) {
      if (lf.z > 2.5) continue;
      const dx = lf.x - wx;
      const dy = lf.y - wy;
      const d = Math.hypot(dx, dy);
      if (d < radius + lf.size) {
        const push = (1 - d / (radius + lf.size)) * Math.max(18, speed * 0.55);
        const nx = d > 0.1 ? dx / d : dirX;
        const ny = d > 0.1 ? dy / d : dirY;
        lf.vx += (dirX * 0.65 + nx * 0.55) * push * 0.35;
        lf.vy += (dirY * 0.65 + ny * 0.55) * push * 0.35;
        lf.vz = Math.max(lf.vz, 5.5 + Math.random() * 5.0);
        lf.vrot += (Math.random() - 0.5) * 8.0;
      }
    }
  }

  function drawPalmateMapleLeaf(ctx, radius, pal, shadowOnly) {
    // 7-lobed Japanese Acer palmatum silhouette
    ctx.beginPath();
    const lobes = [
      { ang: -Math.PI * 0.5, len: 1.02, w: 0.22 },
      { ang: -Math.PI * 0.5 - 0.58, len: 0.90, w: 0.21 },
      { ang: -Math.PI * 0.5 + 0.58, len: 0.90, w: 0.21 },
      { ang: -Math.PI * 0.5 - 1.18, len: 0.72, w: 0.19 },
      { ang: -Math.PI * 0.5 + 1.18, len: 0.72, w: 0.19 },
      { ang: -Math.PI * 0.5 - 1.72, len: 0.44, w: 0.15 },
      { ang: -Math.PI * 0.5 + 1.72, len: 0.44, w: 0.15 }
    ];

    // Trace star-like palmate outline clockwise
    const ordered = [5, 3, 1, 0, 2, 4, 6];
    ctx.moveTo(0, radius * 0.16);
    for (let k = 0; k < ordered.length; k++) {
      const lb = lobes[ordered[k]];
      const tipX = Math.cos(lb.ang) * radius * lb.len;
      const tipY = Math.sin(lb.ang) * radius * lb.len;
      const c1x = Math.cos(lb.ang - lb.w) * radius * lb.len * 0.52;
      const c1y = Math.sin(lb.ang - lb.w) * radius * lb.len * 0.52;
      const c2x = Math.cos(lb.ang + lb.w) * radius * lb.len * 0.52;
      const c2y = Math.sin(lb.ang + lb.w) * radius * lb.len * 0.52;
      ctx.quadraticCurveTo(c1x, c1y, tipX, tipY);
      const nextBaseAng = lb.ang + lb.w * 1.15;
      ctx.quadraticCurveTo(c2x, c2y, Math.cos(nextBaseAng) * radius * 0.17, Math.sin(nextBaseAng) * radius * 0.17);
    }
    ctx.closePath();

    if (shadowOnly) {
      ctx.fill();
      return;
    }

    const grad = ctx.createRadialGradient(0, -radius * 0.1, radius * 0.08, 0, 0, radius * 1.05);
    grad.addColorStop(0, pal[2]);
    grad.addColorStop(0.65, pal[0]);
    grad.addColorStop(1, pal[1]);
    ctx.fillStyle = grad;
    ctx.fill();

    // Delicate veins & petiole stem
    ctx.strokeStyle = 'rgba(255, 224, 182, 0.22)';
    ctx.lineWidth = Math.max(0.5, radius * 0.04);
    ctx.beginPath();
    for (const lb of lobes) {
      ctx.moveTo(0, radius * 0.08);
      ctx.lineTo(Math.cos(lb.ang) * radius * lb.len * 0.78, Math.sin(lb.ang) * radius * lb.len * 0.78);
    }
    ctx.stroke();

    ctx.strokeStyle = pal[1];
    ctx.lineWidth = Math.max(0.7, radius * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, radius * 0.14);
    ctx.quadraticCurveTo(radius * 0.08, radius * 0.45, radius * 0.16, radius * 0.68);
    ctx.stroke();
  }

  function stepAndRenderFX(dt, nowMs) {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    fxCtx.save();
    fxCtx.scale(world.dpr, world.dpr);

    const sun = getSunDir();
    const shScaleX = -sun[0] / Math.max(sun[2], 0.22);
    const shScaleY = -sun[1] / Math.max(sun[2], 0.22);
    const lightBoost = state.lightName === 'moon' ? 0.58 : (state.lightName === 'mist' ? 0.78 : 1.0);
    const shAlpha = state.lightName === 'mist' ? 0.16 : 0.34;

    // 1) Update & render airborne kicked gravel grains
    for (let i = grains.length - 1; i >= 0; i--) {
      const g = grains[i];
      g.age += dt;
      if (g.age >= g.life) {
        grains.splice(i, 1);
        continue;
      }
      g.vz -= 210.0 * dt; // gravity (cm/s^2 scaled for crisp micro-hop feel)
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      g.z += g.vz * dt;
      g.vx *= Math.pow(0.28, dt);
      g.vy *= Math.pow(0.28, dt);

      if (g.z <= 0.1) {
        g.z = 0.1;
        if (g.bounces < 1 && Math.abs(g.vz) > 10) {
          g.vz = -g.vz * 0.34;
          g.vx *= 0.55;
          g.vy *= 0.55;
          g.bounces++;
        } else {
          g.vz = 0;
          g.vx *= 0.2;
          g.vy *= 0.2;
        }
      }

      const alpha = Math.min(1, (g.life - g.age) / 0.18);
      const [sx, sy, ppm] = worldToScreen(g.x + g.z * shScaleX, g.y + g.z * shScaleY, 0.05);
      const [px, py] = worldToScreen(g.x, g.y, g.z);
      const rad = Math.max(0.8, g.size * ppm);

      // Tiny cast shadow on gravel
      fxCtx.fillStyle = `rgba(18, 16, 14, ${alpha * shAlpha * 0.85})`;
      fxCtx.beginPath();
      fxCtx.arc(sx, sy, rad * 0.95, 0, Math.PI * 2);
      fxCtx.fill();

      // Sunlit gravel pebble
      fxCtx.globalAlpha = alpha * lightBoost;
      fxCtx.fillStyle = g.col;
      fxCtx.beginPath();
      fxCtx.arc(px, py, rad, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.globalAlpha = 1;
    }

    // 2) Update & render delicate Japanese maple leaves (Momiji)
    if (state.leavesOn) {
      const hw = world.bedW * 0.48;
      const hh = world.bedH * 0.48;
      // Rarely drift a fresh autumn leaf across the courtyard if fewer than 5
      if (mapleLeaves.length < 5 && Math.random() < dt * 0.035) {
        mapleLeaves.push(createMapleLeaf(true));
      }

      for (let i = mapleLeaves.length - 1; i >= 0; i--) {
        const lf = mapleLeaves[i];
        if (lf.z > 0.25 || Math.hypot(lf.vx, lf.vy) > 0.2) {
          if (lf.z > 0.25) {
            lf.vz = Math.max(lf.vz - 28 * dt, -9.5);
            // Gentle fluttering aerodynamics
            lf.vx += Math.sin(nowMs * 0.002 + lf.phase) * 7.0 * dt;
            lf.vy += Math.cos(nowMs * 0.0017 + lf.phase) * 6.0 * dt;
            lf.tilt += dt * 2.2;
          } else {
            lf.vx *= Math.pow(0.015, dt);
            lf.vy *= Math.pow(0.015, dt);
            lf.vrot *= Math.pow(0.02, dt);
          }
          lf.x += lf.vx * dt;
          lf.y += lf.vy * dt;
          lf.z += lf.vz * dt;
          lf.rot += lf.vrot * dt;

          if (lf.z <= 0.22) {
            lf.z = 0.22;
            lf.vz = 0;
          }
        }
        // Remove if swept past garden border
        if (Math.abs(lf.x) > hw + 18 || Math.abs(lf.y) > hh + 18) {
          mapleLeaves.splice(i, 1);
          continue;
        }
        // Keep landed leaves clamped subtly inside border & nestled beside stones (not overlapping rock faces)
        if (lf.z <= 0.3) {
          const [px, py] = pushPointOutOfStones(lf.x, lf.y, lf.size * 0.9 + 2.2);
          lf.x = Math.max(-hw + 2, Math.min(hw - 2, px));
          lf.y = Math.max(-hh + 2, Math.min(hh - 2, py));
        }

        const flutterScale = lf.z > 0.35 ? (0.65 + 0.35 * Math.cos(lf.tilt)) : 0.96;
        const [shX, shY, ppm] = worldToScreen(lf.x + lf.z * shScaleX, lf.y + lf.z * shScaleY, 0.05);
        const [lx, ly] = worldToScreen(lf.x, lf.y, lf.z);
        const rPx = lf.size * ppm;

        // Soft cast shadow on sand
        fxCtx.save();
        fxCtx.translate(shX, shY);
        fxCtx.rotate(-lf.rot);
        fxCtx.scale(1, flutterScale * 0.92);
        fxCtx.fillStyle = `rgba(16, 14, 12, ${shAlpha * Math.max(0.25, 1.0 - lf.z * 0.012)})`;
        drawPalmateMapleLeaf(fxCtx, rPx, lf.pal, true);
        fxCtx.restore();

        // Actual maple leaf
        fxCtx.save();
        fxCtx.translate(lx, ly);
        fxCtx.rotate(-lf.rot);
        fxCtx.scale(1, flutterScale);
        fxCtx.globalAlpha = state.lightName === 'moon' ? 0.65 : 0.92;
        drawPalmateMapleLeaf(fxCtx, rPx, lf.pal, false);
        fxCtx.restore();
      }
    }

    // 3) Animated wooden Narashi sweeper beam (when resetting sand bed)
    if (state.sweepActive) {
      const hh = world.bedH * 0.495;
      const zBar = 2.6;
      const [t0x, t0y, ppm] = worldToScreen(state.sweepX,  hh, zBar);
      const [t1x, t1y]      = worldToScreen(state.sweepX, -hh, zBar);
      const [s0x, s0y]      = worldToScreen(state.sweepX + zBar * shScaleX,  hh + zBar * shScaleY, 0.1);
      const [s1x, s1y]      = worldToScreen(state.sweepX + zBar * shScaleX, -hh + zBar * shScaleY, 0.1);

      // Soft shadow of cedar beam
      fxCtx.save();
      fxCtx.strokeStyle = `rgba(14, 12, 10, ${shAlpha * 1.15})`;
      fxCtx.lineWidth = Math.max(4, 3.2 * ppm);
      fxCtx.lineCap = 'round';
      fxCtx.beginPath();
      fxCtx.moveTo(s0x, s0y);
      fxCtx.lineTo(s1x, s1y);
      fxCtx.stroke();

      // Hinoki wooden beam itself
      const grad = fxCtx.createLinearGradient(t0x - 6, t0y, t0x + 6, t0y);
      grad.addColorStop(0, '#5a432e');
      grad.addColorStop(0.45, '#8c6d4d');
      grad.addColorStop(1, '#473322');
      fxCtx.strokeStyle = grad;
      fxCtx.lineWidth = Math.max(5, 2.8 * ppm);
      fxCtx.beginPath();
      fxCtx.moveTo(t0x, t0y);
      fxCtx.lineTo(t1x, t1y);
      fxCtx.stroke();
      fxCtx.restore();
    }

    // 4) Tactile Wooden Rake / Tool Preview Ghost (hover + active raking)
    const idleSec = (nowMs - state.lastMoveTime) * 0.001;
    const tool = TOOLS[state.tool];
    const showGhost = state.pointerInside && state.tool !== 'stone' && !state.sweepActive && (state.pointerDown || idleSec < 1.35);
    if (showGhost) {
      const fade = state.pointerDown ? 0.88 : Math.max(0, 1.0 - Math.max(0, idleSec - 0.65) / 0.70) * 0.62;
      const hoverZ = state.pointerDown ? 0.85 : 3.2;
      const wx = state.pointerDown ? state.rakePos[0] : state.pointerWorld[0];
      const wy = state.pointerDown ? state.rakePos[1] : state.pointerWorld[1];

      // Determine current rake orientation (perp to rakeDir)
      const dir = state.rakeDir;
      const nx = -dir[1];
      const ny = dir[0];

      const halfBedW = world.bedW * 0.5;
      const halfBedH = world.bedH * 0.5;
      if (Math.abs(wx) <= halfBedW + 2 && Math.abs(wy) <= halfBedH + 2) {
        const [, , ppm] = worldToScreen(wx, wy, hoverZ);
        fxCtx.save();

        if (tool.mode === 0) {
          // Multi-tine wooden kumade rake head + tine contact points
          const span = (tool.tines - 1) * tool.spacing * 0.5;
          const pA = [wx - nx * (span + 1.1), wy - ny * (span + 1.1)];
          const pB = [wx + nx * (span + 1.1), wy + ny * (span + 1.1)];

          const [ax, ay] = worldToScreen(pA[0], pA[1], hoverZ + 1.2);
          const [bx, by] = worldToScreen(pB[0], pB[1], hoverZ + 1.2);
          const [sax, say] = worldToScreen(pA[0] + (hoverZ + 1.2) * shScaleX, pA[1] + (hoverZ + 1.2) * shScaleY, 0.1);
          const [sbx, sby] = worldToScreen(pB[0] + (hoverZ + 1.2) * shScaleX, pB[1] + (hoverZ + 1.2) * shScaleY, 0.1);

          // Cast shadow on sand
          fxCtx.strokeStyle = `rgba(16, 14, 11, ${fade * 0.28})`;
          fxCtx.lineWidth = Math.max(2.5, 1.6 * ppm);
          fxCtx.lineCap = 'round';
          fxCtx.beginPath();
          fxCtx.moveTo(sax, say);
          fxCtx.lineTo(sbx, sby);
          fxCtx.stroke();

          // Subtle wooden handle trailing slightly behind crossbar
          const [hx0, hy0] = worldToScreen(wx, wy, hoverZ + 1.2);
          const [hx1, hy1] = worldToScreen(wx - dir[0] * 12.0, wy - dir[1] * 12.0, hoverZ + 5.0);
          fxCtx.strokeStyle = `rgba(176, 144, 106, ${fade * 0.34})`;
          fxCtx.lineWidth = Math.max(2.0, 0.95 * ppm);
          fxCtx.beginPath();
          fxCtx.moveTo(hx0, hy0);
          fxCtx.lineTo(hx1, hy1);
          fxCtx.stroke();

          // Wooden crossbar
          fxCtx.strokeStyle = `rgba(196, 162, 120, ${fade * 0.62})`;
          fxCtx.lineWidth = Math.max(3.0, 1.55 * ppm);
          fxCtx.beginPath();
          fxCtx.moveTo(ax, ay);
          fxCtx.lineTo(bx, by);
          fxCtx.stroke();

          // Individual tine tips biting into gravel
          for (let k = 0; k < tool.tines; k++) {
            const off = (k - (tool.tines - 1) * 0.5) * tool.spacing;
            const [tx, ty] = worldToScreen(wx + nx * off, wy + ny * off, hoverZ * 0.35);
            fxCtx.fillStyle = `rgba(246, 232, 206, ${fade * 0.85})`;
            fxCtx.beginPath();
            fxCtx.arc(tx, ty, Math.max(1.8, tool.halfW * 0.48 * ppm), 0, Math.PI * 2);
            fxCtx.fill();
          }
        } else if (tool.mode === 1) {
          // Single Bamboo Stylus tip
          const [tx, ty] = worldToScreen(wx, wy, hoverZ * 0.3);
          const [sx, sy] = worldToScreen(wx + hoverZ * shScaleX, wy + hoverZ * shScaleY, 0.1);
          const [hx, hy] = worldToScreen(wx - dir[0] * 9.5, wy - dir[1] * 9.5, hoverZ + 6.5);
          fxCtx.strokeStyle = `rgba(16, 14, 11, ${fade * 0.24})`;
          fxCtx.lineWidth = Math.max(2, 0.8 * ppm);
          fxCtx.beginPath();
          fxCtx.moveTo(sx, sy);
          fxCtx.lineTo(hx + hoverZ * shScaleX * ppm * 0.4, hy);
          fxCtx.stroke();

          fxCtx.strokeStyle = `rgba(206, 180, 132, ${fade * 0.65})`;
          fxCtx.lineWidth = Math.max(2.2, 0.95 * ppm);
          fxCtx.lineCap = 'round';
          fxCtx.beginPath();
          fxCtx.moveTo(tx, ty);
          fxCtx.lineTo(hx, hy);
          fxCtx.stroke();

          fxCtx.fillStyle = `rgba(248, 236, 212, ${fade * 0.9})`;
          fxCtx.beginPath();
          fxCtx.arc(tx, ty, Math.max(2.2, 0.72 * ppm), 0, Math.PI * 2);
          fxCtx.fill();
        } else if (tool.mode === 2) {
          // Wide wooden Narashi smoothing board
          const span = tool.halfW;
          const [ax, ay] = worldToScreen(wx - nx * span, wy - ny * span, hoverZ + 0.8);
          const [bx, by] = worldToScreen(wx + nx * span, wy + ny * span, hoverZ + 0.8);
          const [sax, say] = worldToScreen(wx - nx * span + hoverZ * shScaleX, wy - ny * span + hoverZ * shScaleY, 0.1);
          const [sbx, sby] = worldToScreen(wx + nx * span + hoverZ * shScaleX, wy + ny * span + hoverZ * shScaleY, 0.1);

          fxCtx.strokeStyle = `rgba(16, 14, 11, ${fade * 0.25})`;
          fxCtx.lineWidth = Math.max(4, 2.2 * ppm);
          fxCtx.lineCap = 'round';
          fxCtx.beginPath();
          fxCtx.moveTo(sax, say);
          fxCtx.lineTo(sbx, sby);
          fxCtx.stroke();

          fxCtx.strokeStyle = `rgba(204, 174, 134, ${fade * 0.58})`;
          fxCtx.lineWidth = Math.max(4, 2.1 * ppm);
          fxCtx.beginPath();
          fxCtx.moveTo(ax, ay);
          fxCtx.lineTo(bx, by);
          fxCtx.stroke();
        }

        // Orbit assist faint guide ring around target boulder
        const activeGuide = state.altHeld ? 'orbit' : (state.shiftHeld ? 'line' : state.guide);
        if (activeGuide === 'orbit' && state.stones.length > 0) {
          const idx = state.pointerDown && state.orbitStoneIdx >= 0 ? state.orbitStoneIdx : findNearestStone(wx, wy);
          if (idx >= 0) {
            const st = state.stones[idx];
            const rad = state.pointerDown ? state.orbitRadius : Math.max(st.r * Math.max(st.ax, st.ay) + 3.5, Math.hypot(wx - st.x, wy - st.y));
            fxCtx.strokeStyle = `rgba(225, 206, 172, ${fade * 0.26})`;
            fxCtx.lineWidth = 1.0;
            fxCtx.setLineDash([4, 5]);
            fxCtx.beginPath();
            const segs = 48;
            for (let s = 0; s <= segs; s++) {
              const a = (s / segs) * Math.PI * 2;
              const [rx, ry] = worldToScreen(st.x + Math.cos(a) * rad, st.y + Math.sin(a) * rad, 0.3);
              if (s === 0) fxCtx.moveTo(rx, ry);
              else fxCtx.lineTo(rx, ry);
            }
            fxCtx.stroke();
            fxCtx.setLineDash([]);
          }
        }

        fxCtx.restore();
      }
    }

    fxCtx.restore();
  }

  /* ==========================================================================
   * 10. POINTER, RAKING KINEMATICS & STONE ARRANGEMENT INTERACTION
   * ========================================================================== */
  function findNearestStone(wx, wy) {
    let best = -1;
    let bestD = Infinity;
    for (let i = 0; i < state.stones.length; i++) {
      const s = state.stones[i];
      const d = Math.hypot(wx - s.x, wy - s.y) - s.r * Math.max(s.ax, s.ay);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    }
    return best;
  }

  function hitTestStone(wx, wy) {
    for (let i = state.stones.length - 1; i >= 0; i--) {
      const s = state.stones[i];
      const dx = wx - s.x;
      const dy = wy - s.y;
      const c = Math.cos(-s.rot);
      const sn = Math.sin(-s.rot);
      const lx = c * dx - sn * dy;
      const ly = sn * dx + c * dy;
      const rx = s.r * s.ax * 1.1;
      const ry = s.r * s.ay * 1.1;
      if ((lx * lx) / (rx * rx) + (ly * ly) / (ry * ry) <= 1.0) return i;
    }
    return -1;
  }

  function clampToBed(wx, wy, margin = 3.0) {
    const hw = world.bedW * 0.5 - margin;
    const hh = world.bedH * 0.5 - margin;
    return [
      Math.max(-hw, Math.min(hw, wx)),
      Math.max(-hh, Math.min(hh, wy))
    ];
  }

  function effectiveGuide() {
    if (state.altHeld) return 'orbit';
    if (state.shiftHeld) return 'line';
    return state.guide;
  }

  function dismissHint() {
    if (!state.hasInteracted) {
      state.hasInteracted = true;
      document.getElementById('hintLine').classList.add('is-hidden');
    }
  }

  let bannerTimer = null;
  function showBanner(text, ms = 2200) {
    const el = document.getElementById('modeBanner');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(bannerTimer);
    if (ms > 0) {
      bannerTimer = setTimeout(() => el.classList.remove('show'), ms);
    }
  }

  function closePopovers() {
    document.getElementById('lightPopover').classList.remove('is-open');
    document.getElementById('gardenPopover').classList.remove('is-open');
    document.getElementById('lightBtn').classList.remove('is-active');
    document.getElementById('gardenBtn').classList.remove('is-active');
  }

  function updateCursorClass() {
    glCanvas.classList.remove('cursor-grab', 'cursor-grabbing');
    if (state.tool === 'stone') {
      if (state.grabbedStone >= 0) glCanvas.classList.add('cursor-grabbing');
      else glCanvas.classList.add('cursor-grab');
    }
  }

  function applyRakeSegment(p0, p1, n0, n1, speed) {
    const tool = TOOLS[state.tool];
    const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
    if (dist < 0.05) return;

    const steps = Math.max(1, Math.min(20, Math.ceil(dist / 1.35)));
    for (let s = 0; s < steps; s++) {
      const t0 = s / steps;
      const t1 = (s + 1) / steps;
      const sp0 = [p0[0] + (p1[0] - p0[0]) * t0, p0[1] + (p1[1] - p0[1]) * t0];
      const sp1 = [p0[0] + (p1[0] - p0[0]) * t1, p0[1] + (p1[1] - p0[1]) * t1];

      const ix0 = n0[0] + (n1[0] - n0[0]) * t0;
      const iy0 = n0[1] + (n1[1] - n0[1]) * t0;
      const il0 = Math.hypot(ix0, iy0) || 1;
      const sn0 = [ix0 / il0, iy0 / il0];

      const ix1 = n0[0] + (n1[0] - n0[0]) * t1;
      const iy1 = n0[1] + (n1[1] - n0[1]) * t1;
      const il1 = Math.hypot(ix1, iy1) || 1;
      const sn1 = [ix1 / il1, iy1 / il1];

      runRakeStep({
        p0: sp0, p1: sp1, n0: sn0, n1: sn1,
        mode: tool.mode,
        tines: tool.tines,
        spacing: tool.spacing,
        halfW: tool.halfW,
        depth: tool.depth,
        strength: tool.mode === 2 ? 0.65 : 0.88
      });
    }

    // Kick up airborne sunlit gravel pebbles along tine tips!
    const dirX = (p1[0] - p0[0]) / dist;
    const dirY = (p1[1] - p0[1]) / dist;
    if (tool.mode !== 2 && speed > 4.0) {
      const grainBurst = Math.min(10, Math.ceil(dist * (tool.tines * 0.25 + 0.4)));
      for (let g = 0; g < grainBurst; g++) {
        const k = (Math.random() * tool.tines) | 0;
        const off = (k - (tool.tines - 1) * 0.5) * tool.spacing;
        spawnKickedGrains(p1[0] + n1[0] * off, p1[1] + n1[1] * off, dirX, dirY, speed, 1);
      }
    }

    // Gently nudge maple leaves lying in the rake's path
    nudgeLeavesFromRake(p1[0], p1[1], dirX, dirY, Math.max(4.0, tool.width * 0.58), speed);

    // Run 1 immediate avalanche pass on large strokes for responsive sand flow
    runRelaxPasses(1, 0.16);
    state.settleFrames = 34;
  }

  function addNewStoneAt(wx, wy) {
    if (state.stones.length >= MAX_STONES) {
      showBanner('Maximum 7 stones — double-click a stone to lift it');
      return;
    }
    const [cx, cy] = clampToBed(wx, wy, 16);
    pushUndoSnapshot();
    const sc = Math.max(0.8, Math.min(1.08, Math.min(world.bedW / 260, world.bedH / 170)));
    const r = (9.5 + Math.random() * 5.2) * sc;
    const newStone = {
      x: cx,
      y: cy,
      rot: Math.random() * Math.PI * 2,
      r,
      ax: 1.05 + Math.random() * 0.28,
      ay: 0.78 + Math.random() * 0.16,
      hz: r * (0.85 + Math.random() * 0.52),
      seed: 1.0 + Math.random() * 14.0,
      moss: 0.52 + Math.random() * 0.36,
      flat: 0.20 + Math.random() * 0.45,
      sink: 1.8
    };
    state.stones.push(newStone);
    const idx = state.stones.length - 1;
    // Impress stone collar into gravel
    runRakeStep({
      p0: [cx, cy], p1: [cx, cy], n0: [0, 1], n1: [0, 1],
      mode: 4, activeStone: idx, strength: 1.0
    });
    runRelaxPasses(6, 0.17);
    state.settleFrames = 26;
    spawnKickedGrains(cx, cy, 1, 0, 35, 16);
    triggerStoneThud(0.85);
    showBanner(`Placed stone (${state.stones.length}/${MAX_STONES}) · Scroll to rotate · Double-click to remove`);
  }

  function removeStoneAt(idx) {
    if (idx < 0 || idx >= state.stones.length) return;
    pushUndoSnapshot();
    const st = state.stones[idx];
    state.stones.splice(idx, 1);
    state.hoveredStone = -1;
    state.grabbedStone = -1;
    state.settleFrames = 28;
    spawnKickedGrains(st.x, st.y, 0, 1, 22, 12);
    triggerStoneThud(0.45);
    showBanner(`Lifted stone (${state.stones.length}/${MAX_STONES})`);
  }

  // Pointer event handlers
  let lastPointerMoveMs = performance.now();
  let lastStoneTapTime = 0;
  let lastStoneTapIdx = -1;

  glCanvas.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return;
    initAudio();
    closePopovers();
    dismissHint();

    glCanvas.setPointerCapture(e.pointerId);
    state.pointerDown = true;
    state.pointerId = e.pointerId;
    state.pointerInside = true;
    state.lastMoveTime = performance.now();
    lastPointerMoveMs = state.lastMoveTime;

    const w = screenToWorld(e.clientX, e.clientY, 0);
    state.pointerWorld = w;

    if (state.tool === 'stone') {
      const hitIdx = hitTestStone(w[0], w[1]);
      if (hitIdx >= 0) {
        const now = performance.now();
        if (hitIdx === lastStoneTapIdx && now - lastStoneTapTime < 340) {
          // Double-tap / double-click removes stone cleanly
          removeStoneAt(hitIdx);
          state.pointerDown = false;
          lastStoneTapIdx = -1;
          return;
        }
        lastStoneTapIdx = hitIdx;
        lastStoneTapTime = now;

        pushUndoSnapshot();
        state.grabbedStone = hitIdx;
        state.grabOffset = [state.stones[hitIdx].x - w[0], state.stones[hitIdx].y - w[1]];
        state.strokePrevWorld = [state.stones[hitIdx].x, state.stones[hitIdx].y];
        triggerStoneThud(0.55);
        updateCursorClass();
      } else {
        // Click open sand in Stones mode to place a new mossy boulder
        const hw = world.bedW * 0.5 - 10;
        const hh = world.bedH * 0.5 - 10;
        if (Math.abs(w[0]) < hw && Math.abs(w[1]) < hh) {
          addNewStoneAt(w[0], w[1]);
        }
        state.pointerDown = false;
      }
      return;
    }

    // Begin rake / stylus / smooth stroke
    const [cw, ch] = clampToBed(w[0], w[1], 1.2);
    pushUndoSnapshot();
    state.strokeStarted = true;
    state.strokeStartWorld = [cw, ch];
    state.strokePrevWorld = [cw, ch];
    state.rakePos = [cw, ch];
    state.rakeHeadingReady = false;
    state.lineAxis = null;
    state.strokeSpeed = 0;

    if (effectiveGuide() === 'orbit' && state.stones.length > 0) {
      const sIdx = findNearestStone(cw, ch);
      state.orbitStoneIdx = sIdx;
      const st = state.stones[sIdx];
      const minR = st.r * Math.max(st.ax, st.ay) + 3.2;
      state.orbitRadius = Math.max(minR, Math.hypot(cw - st.x, ch - st.y));
      state.orbitAngle = Math.atan2(ch - st.y, cw - st.x);
      const sx = st.x + Math.cos(state.orbitAngle) * state.orbitRadius;
      const sy = st.y + Math.sin(state.orbitAngle) * state.orbitRadius;
      state.rakePos = [sx, sy];
      state.strokePrevWorld = [sx, sy];
    }

    document.body.classList.add('is-raking');
  });

  glCanvas.addEventListener('pointermove', (e) => {
    const now = performance.now();
    const dt = Math.max(0.004, (now - lastPointerMoveMs) * 0.001);
    lastPointerMoveMs = now;
    state.lastMoveTime = now;
    state.pointerInside = true;
    state.pointerScreen = [e.clientX, e.clientY];

    const w = screenToWorld(e.clientX, e.clientY, 0);
    const prevW = state.pointerWorld;
    state.pointerWorld = w;

    if (!state.pointerDown) {
      if (state.tool === 'stone') {
        state.hoveredStone = hitTestStone(w[0], w[1]);
      } else {
        // Gently align hover preview rake with cursor travel direction
        const dx = w[0] - prevW[0];
        const dy = w[1] - prevW[1];
        const dl = Math.hypot(dx, dy);
        if (dl > 0.35) {
          const td = [dx / dl, dy / dl];
          const blend = Math.min(0.32, dl * 0.06);
          const nx = state.rakeDir[0] * (1 - blend) + td[0] * blend;
          const ny = state.rakeDir[1] * (1 - blend) + td[1] * blend;
          const nl = Math.hypot(nx, ny) || 1;
          state.rakeDir = [nx / nl, ny / nl];
        }
      }
      return;
    }

    // Dragging a boulder through gravel
    if (state.tool === 'stone' && state.grabbedStone >= 0) {
      const st = state.stones[state.grabbedStone];
      const pad = st.r * Math.max(st.ax, st.ay) + 3.5;
      const [nx, ny] = clampToBed(w[0] + state.grabOffset[0], w[1] + state.grabOffset[1], pad);
      const p0 = [st.x, st.y];
      const p1 = [nx, ny];
      const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      st.x = nx;
      st.y = ny;
      state.strokeSpeed = dist / dt;

      if (dist > 0.25) {
        runRakeStep({
          p0, p1, n0: [0, 1], n1: [0, 1],
          mode: 4, activeStone: state.grabbedStone, strength: 1.0
        });
        runRelaxPasses(2, 0.17);
        state.settleFrames = 32;
        nudgeLeavesFromRake(nx, ny, (p1[0] - p0[0]) / dist, (p1[1] - p0[1]) / dist, st.r * 1.3, state.strokeSpeed);
        if (Math.random() < 0.5) {
          spawnKickedGrains(nx + ((p1[0] - p0[0]) / dist) * st.r, ny + ((p1[1] - p0[1]) / dist) * st.r, (p1[0] - p0[0]) / dist, (p1[1] - p0[1]) / dist, state.strokeSpeed, 2);
        }
      }
      return;
    }

    if (!state.strokeStarted) return;

    // Target world position with optional Line / Orbit assist
    let [tx, ty] = clampToBed(w[0], w[1], 1.2);
    const guide = effectiveGuide();

    if (guide === 'line') {
      const dx0 = tx - state.strokeStartWorld[0];
      const dy0 = ty - state.strokeStartWorld[1];
      if (!state.lineAxis && Math.hypot(dx0, dy0) > 2.2) {
        // Snap to horizontal, vertical, or 45-degree temple axis
        const ang = Math.atan2(dy0, dx0);
        const snapped = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
        state.lineAxis = [Math.cos(snapped), Math.sin(snapped)];
      }
      if (state.lineAxis) {
        const proj = dx0 * state.lineAxis[0] + dy0 * state.lineAxis[1];
        tx = state.strokeStartWorld[0] + state.lineAxis[0] * proj;
        ty = state.strokeStartWorld[1] + state.lineAxis[1] * proj;
        [tx, ty] = clampToBed(tx, ty, 1.2);
      }
    } else if (guide === 'orbit' && state.orbitStoneIdx >= 0 && state.orbitStoneIdx < state.stones.length) {
      const st = state.stones[state.orbitStoneIdx];
      const ang = Math.atan2(ty - st.y, tx - st.x);
      // Subdivide large angular jumps cleanly along the circle
      let dAng = ang - state.orbitAngle;
      while (dAng > Math.PI) dAng -= Math.PI * 2;
      while (dAng < -Math.PI) dAng += Math.PI * 2;
      const arcLen = Math.abs(dAng) * state.orbitRadius;
      state.strokeSpeed = arcLen / dt;
      if (arcLen > 0.35) {
        const arcSegs = Math.max(1, Math.min(18, Math.ceil(arcLen / 1.5)));
        const signDir = dAng >= 0 ? 1 : -1;
        for (let s = 0; s < arcSegs; s++) {
          const a0 = state.orbitAngle + (dAng * s) / arcSegs;
          const a1 = state.orbitAngle + (dAng * (s + 1)) / arcSegs;
          const p0 = [st.x + Math.cos(a0) * state.orbitRadius, st.y + Math.sin(a0) * state.orbitRadius];
          const p1 = [st.x + Math.cos(a1) * state.orbitRadius, st.y + Math.sin(a1) * state.orbitRadius];
          // Radial normal keeps tines concentric around stone!
          const n0 = [Math.cos(a0), Math.sin(a0)];
          const n1 = [Math.cos(a1), Math.sin(a1)];
          applyRakeSegment(p0, p1, n0, n1, state.strokeSpeed);
          state.rakePos = p1;
          state.rakeDir = [-Math.sin(a1) * signDir, Math.cos(a1) * signDir];
        }
        state.orbitAngle = ang;
      }
      return;
    }

    // Freehand / Line physical wooden-rake trailing inertia
    const p0 = [state.rakePos[0], state.rakePos[1]];
    const dx = tx - p0[0];
    const dy = ty - p0[1];
    const dist = Math.hypot(dx, dy);
    state.strokeSpeed = dist / dt;

    if (!state.rakeHeadingReady) {
      if (dist < 1.1) return; // Wait for clean initial heading before biting into sand
      state.rakeDir = [dx / dist, dy / dist];
      state.rakeHeadingReady = true;
    }

    if (dist < 0.25) return;

    const n0 = [-state.rakeDir[1], state.rakeDir[0]];

    // Smooth physical heading damping (like real wooden rake pulled by handle)
    const targetDir = [dx / dist, dy / dist];
    const turnAlpha = guide === 'line' ? 1.0 : Math.min(0.85, 1.0 - Math.exp(-dist * 0.24));
    let newDx = state.rakeDir[0] + (targetDir[0] - state.rakeDir[0]) * turnAlpha;
    let newDy = state.rakeDir[1] + (targetDir[1] - state.rakeDir[1]) * turnAlpha;
    const nl = Math.hypot(newDx, newDy) || 1;
    const newDir = [newDx / nl, newDy / nl];
    const n1 = [-newDir[1], newDir[0]];

    applyRakeSegment(p0, [tx, ty], n0, n1, state.strokeSpeed);
    state.rakePos = [tx, ty];
    state.rakeDir = newDir;
    state.strokePrevWorld = [tx, ty];
  });

  function endPointer(e) {
    if (!state.pointerDown) return;
    if (state.tool === 'stone' && state.grabbedStone >= 0) {
      triggerStoneThud(0.75);
      state.grabbedStone = -1;
      updateCursorClass();
    } else if (state.strokeStarted && !state.rakeHeadingReady && state.tool === 'stylus') {
      // Single tap with bamboo stylus makes a crisp meditative dot/dimple
      runRakeStep({
        p0: state.rakePos,
        p1: [state.rakePos[0] + 0.05, state.rakePos[1]],
        n0: [0, 1], n1: [0, 1],
        mode: 1, tines: 1, spacing: 0, halfW: 1.4, depth: 1.5, strength: 0.9
      });
      runRelaxPasses(3, 0.16);
      state.settleFrames = 24;
    }

    state.pointerDown = false;
    state.strokeStarted = false;
    state.strokeSpeed = 0;
    document.body.classList.remove('is-raking');
    if (e && e.pointerId !== undefined && glCanvas.hasPointerCapture(e.pointerId)) {
      try { glCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }

  glCanvas.addEventListener('pointerup', endPointer);
  glCanvas.addEventListener('pointercancel', endPointer);
  glCanvas.addEventListener('pointerleave', () => {
    if (!state.pointerDown) state.pointerInside = false;
  });

  // Scroll wheel rotates stone in Stones mode (or gently scrubs sun angle if Shift held!)
  glCanvas.addEventListener('wheel', (e) => {
    if (state.tool === 'stone') {
      const idx = state.grabbedStone >= 0 ? state.grabbedStone : state.hoveredStone;
      if (idx >= 0) {
        e.preventDefault();
        const st = state.stones[idx];
        st.rot += e.deltaY * 0.004;
        runRakeStep({
          p0: [st.x, st.y], p1: [st.x, st.y], n0: [0, 1], n1: [0, 1],
          mode: 4, activeStone: idx, strength: 0.5
        });
        state.settleFrames = 16;
      }
    }
  }, { passive: false });

  glCanvas.addEventListener('contextmenu', (e) => {
    if (state.tool === 'stone') {
      e.preventDefault();
      const w = screenToWorld(e.clientX, e.clientY, 0);
      const hitIdx = hitTestStone(w[0], w[1]);
      if (hitIdx >= 0) removeStoneAt(hitIdx);
    }
  });

  /* ==========================================================================
   * 11. UI CONTROLS, KEYBOARD SHORTCUTS & ANIMATED SWEEPER
   * ========================================================================== */
  function selectTool(toolName) {
    if (!TOOLS[toolName]) return;
    state.tool = toolName;
    state.grabbedStone = -1;
    state.hoveredStone = -1;
    document.querySelectorAll('#toolGroup .tool-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.tool === toolName);
    });
    updateCursorClass();
    if (toolName === 'stone') {
      showBanner('Drag stones · Scroll to rotate · Click sand to add · Double-click to lift', 3400);
    } else {
      showBanner(TOOLS[toolName].label, 1400);
    }
  }

  function cycleGuide() {
    const order = ['free', 'line', 'orbit'];
    const labels = { free: 'Free', line: 'Line', orbit: 'Orbit' };
    const next = order[(order.indexOf(state.guide) + 1) % order.length];
    state.guide = next;
    document.getElementById('guideLabel').textContent = labels[next];
    document.getElementById('guideBtn').classList.toggle('is-active', next !== 'free');
    const desc = next === 'free' ? 'Freehand raking' : (next === 'line' ? 'Straight temple rows (Line lock)' : 'Concentric ripples around nearest stone');
    showBanner(desc, 2000);
  }

  function selectLight(name) {
    const p = LIGHT_PRESETS[name];
    if (!p) return;
    state.lightName = name;
    state.targetAzimuth = p.azimuth;
    state.targetElevation = p.elevation;
    document.getElementById('sunAzimuth').value = p.azimuth;
    document.getElementById('sunAzimuthVal').textContent = `${p.azimuth}°`;
    document.getElementById('sunElevation').value = p.elevation;
    document.getElementById('sunElevationVal').textContent = `${p.elevation}°`;
    document.querySelectorAll('#lightChoices .pop-choice').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.light === name);
    });
  }

  function startSweepSmooth() {
    if (state.sweepActive) return;
    initAudio();
    pushUndoSnapshot();
    state.sweepActive = true;
    state.sweepX = -world.bedW * 0.5 - 6.0;
    state.sweepPrevX = state.sweepX;
    showBanner('Smoothing sand bed…', 1600);
  }

  function toggleView() {
    state.verandaView = !state.verandaView;
    cam.targetPitchDeg = state.verandaView ? 61.5 : 78.5;
    document.getElementById('viewLabel').textContent = state.verandaView ? 'Veranda' : 'Plan';
    document.getElementById('viewBtn').classList.toggle('is-active', state.verandaView);
  }

  function toggleAudio() {
    initAudio();
    state.audioEnabled = !state.audioEnabled;
    document.getElementById('audioBtn').classList.toggle('is-active', state.audioEnabled);
    document.getElementById('audioIconOn').style.display = state.audioEnabled ? 'block' : 'none';
    document.getElementById('audioIconOff').style.display = state.audioEnabled ? 'none' : 'block';
  }

  function toggleZenMode() {
    state.zenMode = !state.zenMode;
    closePopovers();
    document.body.classList.toggle('zen-mode', state.zenMode);
    document.getElementById('zenBtn').classList.toggle('is-active', state.zenMode);
  }

  // Bind UI buttons
  document.querySelectorAll('#toolGroup .tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      initAudio();
      closePopovers();
      selectTool(btn.dataset.tool);
    });
  });

  document.getElementById('guideBtn').addEventListener('click', () => {
    initAudio();
    closePopovers();
    cycleGuide();
  });

  document.getElementById('lightBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    dismissHint();
    const pop = document.getElementById('lightPopover');
    const wasOpen = pop.classList.contains('is-open');
    closePopovers();
    if (!wasOpen) {
      pop.classList.add('is-open');
      document.getElementById('lightBtn').classList.add('is-active');
    }
  });

  document.getElementById('gardenBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    dismissHint();
    const pop = document.getElementById('gardenPopover');
    const wasOpen = pop.classList.contains('is-open');
    closePopovers();
    if (!wasOpen) {
      pop.classList.add('is-open');
      document.getElementById('gardenBtn').classList.add('is-active');
    }
  });

  document.querySelectorAll('#lightChoices .pop-choice').forEach(btn => {
    btn.addEventListener('click', () => selectLight(btn.dataset.light));
  });

  document.querySelectorAll('#gardenChoices .pop-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const preset = btn.dataset.preset;
      document.querySelectorAll('#gardenChoices .pop-choice').forEach(b => {
        b.classList.toggle('is-active', b === btn);
      });
      applyPreset(preset, true);
      closePopovers();
      triggerStoneThud(0.4);
      showBanner(`Garden: ${btn.querySelector('.name').textContent}`, 1800);
    });
  });

  document.getElementById('sunAzimuth').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.targetAzimuth = v;
    state.sunAzimuth = v;
    document.getElementById('sunAzimuthVal').textContent = `${Math.round(v)}°`;
  });

  document.getElementById('sunElevation').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.targetElevation = v;
    state.sunElevation = v;
    document.getElementById('sunElevationVal').textContent = `${Math.round(v)}°`;
  });

  document.getElementById('komorebiToggle').addEventListener('click', (e) => {
    state.komorebiOn = !state.komorebiOn;
    e.currentTarget.classList.toggle('is-active', state.komorebiOn);
  });

  document.getElementById('leavesToggle').addEventListener('click', (e) => {
    state.leavesOn = !state.leavesOn;
    e.currentTarget.classList.toggle('is-active', state.leavesOn);
    if (state.leavesOn && mapleLeaves.length === 0) initMapleLeaves();
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    initAudio();
    performUndo();
  });

  document.getElementById('sweepBtn').addEventListener('click', () => {
    closePopovers();
    startSweepSmooth();
  });

  document.getElementById('viewBtn').addEventListener('click', toggleView);
  document.getElementById('audioBtn').addEventListener('click', toggleAudio);
  document.getElementById('zenBtn').addEventListener('click', toggleZenMode);

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') state.shiftHeld = true;
    if (e.key === 'Alt') state.altHeld = true;

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      performUndo();
      return;
    }
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

    const k = e.key.toLowerCase();
    if (k === '1') selectTool('rake');
    else if (k === '2') selectTool('fine');
    else if (k === '3') selectTool('wave');
    else if (k === '4') selectTool('stylus');
    else if (k === '5') selectTool('smooth');
    else if (k === '6') selectTool('stone');
    else if (k === 'g') cycleGuide();
    else if (k === 'v') toggleView();
    else if (k === 'm') toggleAudio();
    else if (k === 'h' || k === 'escape') {
      if (k === 'escape') {
        closePopovers();
        if (state.zenMode) toggleZenMode();
      } else {
        toggleZenMode();
      }
    }
    else if (k === 'r') startSweepSmooth();
    else if (k === 'q' || k === 'e') {
      const delta = k === 'q' ? -8 : 8;
      state.targetAzimuth = (state.targetAzimuth + delta + 360) % 360;
      document.getElementById('sunAzimuth').value = Math.round(state.targetAzimuth);
      document.getElementById('sunAzimuthVal').textContent = `${Math.round(state.targetAzimuth)}°`;
    }
    else if ((k === '[' || k === ']') && state.tool === 'stone') {
      const idx = state.grabbedStone >= 0 ? state.grabbedStone : state.hoveredStone;
      if (idx >= 0) {
        state.stones[idx].rot += (k === '[' ? -0.18 : 0.18);
        state.settleFrames = 10;
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') state.shiftHeld = false;
    if (e.key === 'Alt') state.altHeld = false;
  });

  /* ==========================================================================
   * 12. RESIZE & ASPECT-MATCHED SIMULATION BUFFER MANAGEMENT
   * ========================================================================== */
  function resizeViewport(initial = false) {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, w > 1400 ? 1.75 : 2.0);

    world.viewW = w;
    world.viewH = h;
    world.dpr = dpr;
    cam.aspect = w / h;

    glCanvas.width = Math.round(w * dpr);
    glCanvas.height = Math.round(h * dpr);
    fxCanvas.width = Math.round(w * dpr);
    fxCanvas.height = Math.round(h * dpr);

    // Compute physical gravel bed dimensions (cm) matched cleanly to viewport aspect
    if (initial || !sandA) {
      const asp = Math.max(0.62, Math.min(2.05, w / h));
      if (asp >= 1.0) {
        world.bedH = 168.0;
        world.bedW = Math.round(168.0 * asp);
      } else {
        world.bedW = 148.0;
        world.bedH = Math.round(148.0 / asp);
      }

      // Square-texel simulation FBO (~1152 on long axis, ~2.2mm per cell!)
      const longAxis = Math.min(w, h) < 600 ? 896 : 1152;
      if (world.bedW >= world.bedH) {
        world.simW = longAxis;
        world.simH = Math.max(512, Math.round(longAxis * (world.bedH / world.bedW)));
      } else {
        world.simH = longAxis;
        world.simW = Math.max(512, Math.round(longAxis * (world.bedW / world.bedH)));
      }

      destroySimTarget(sandA);
      destroySimTarget(sandB);
      clearUndoStack();
      sandA = createSimTarget(world.simW, world.simH);
      sandB = createSimTarget(world.simW, world.simH);
      applyPreset(state.preset, false);
    }

    updateCamera();
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    resizeViewport(false);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // Only rebuild FBO if aspect ratio changed substantially (e.g. phone orientation flip)
      const oldAsp = world.bedW / world.bedH;
      const newAsp = Math.max(0.62, Math.min(2.05, window.innerWidth / Math.max(1, window.innerHeight)));
      if (Math.abs(oldAsp - newAsp) > 0.35) {
        resizeViewport(true);
      }
    }, 280);
  });

  resizeViewport(true);

  /* ==========================================================================
   * 13. MAIN RENDER & PHYSICS LOOP
   * ========================================================================== */
  let lastFrameMs = performance.now();
  let rainAccum = 0;

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpAngleDeg(a, b, t) {
    let diff = ((b - a + 540) % 360) - 180;
    return (a + diff * t + 360) % 360;
  }

  function frame(nowMs) {
    const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastFrameMs) * 0.001));
    lastFrameMs = nowMs;

    // 1) Smooth camera pitch & atmospheric lighting transitions
    const lp = LIGHT_PRESETS[state.lightName];
    const smoothT = Math.min(1, dt * 4.5);

    if (Math.abs(cam.pitchDeg - cam.targetPitchDeg) > 0.01) {
      cam.pitchDeg = lerp(cam.pitchDeg, cam.targetPitchDeg, Math.min(1, dt * 6.5));
      updateCamera();
    }

    state.sunAzimuth   = lerpAngleDeg(state.sunAzimuth, state.targetAzimuth, smoothT);
    state.sunElevation = lerp(state.sunElevation, state.targetElevation, smoothT);
    for (let c = 0; c < 3; c++) {
      state.curSunCol[c]    = lerp(state.curSunCol[c], lp.sunColor[c], smoothT);
      state.curSkyCol[c]    = lerp(state.curSkyCol[c], lp.skyColor[c], smoothT);
      state.curBounceCol[c] = lerp(state.curBounceCol[c], lp.bounceCol[c], smoothT);
    }
    state.curWetness  = lerp(state.curWetness, lp.wetness, smoothT * 0.6);
    state.curExposure = lerp(state.curExposure, lp.exposure, smoothT);
    const targetKomo = state.komorebiOn ? lp.komorebiStr : 0.0;
    state.curKomorebiStr = lerp(state.curKomorebiStr, targetKomo, smoothT);

    // 2) Animated full-garden wooden Narashi sweeper bar
    if (state.sweepActive) {
      state.sweepPrevX = state.sweepX;
      const sweepSpeed = world.bedW / 1.35; // glides cleanly across in ~1.35s
      state.sweepX += sweepSpeed * dt;
      runRakeStep({
        p0: [state.sweepPrevX, 0],
        p1: [state.sweepX, 0],
        n0: [0, 1],
        n1: [0, 1],
        mode: 3,
        strength: 0.9
      });
      // Kick tiny dust grains ahead of sweeping cedar bar & push maple leaves gracefully
      if (Math.random() < 0.75) {
        const ry = (Math.random() - 0.5) * world.bedH * 0.9;
        spawnKickedGrains(state.sweepX + 2.0, ry, 1, 0, 55, 2);
      }
      for (const lf of mapleLeaves) {
        if (Math.abs(lf.x - state.sweepX) < 6.0 && lf.z < 2.0) {
          lf.vx += 42 * dt * 10;
          lf.vz = Math.max(lf.vz, 7.5);
          lf.vrot += (Math.random() - 0.5) * 6;
        }
      }
      runRelaxPasses(1, 0.16);
      state.settleFrames = 26;

      if (state.sweepX > world.bedW * 0.5 + 8.0) {
        state.sweepActive = false;
      }
    }

    // 3) Gentle Kyoto raindrops dimpling the gravel when in Mist weather mode
    if (lp.rainRate > 0.01) {
      rainAccum += lp.rainRate * dt;
      while (rainAccum >= 1.0) {
        rainAccum -= 1.0;
        const rx = (Math.random() - 0.5) * (world.bedW - 6);
        const ry = (Math.random() - 0.5) * (world.bedH - 6);
        runRakeStep({
          p0: [rx, ry], p1: [rx, ry],
          n0: [0, 1], n1: [0, 1],
          mode: 5,
          halfW: 0.75 + Math.random() * 0.55,
          depth: 0.20 + Math.random() * 0.16,
          strength: 1.0
        });
        state.settleFrames = Math.max(state.settleFrames, 2);
        if (Math.random() < 0.35) {
          triggerGrainTick(0.010, 1600 + Math.random() * 1400);
        }
      }
    }

    // 4) Angle-of-repose granular relaxation passes (only while sand is actively settling)
    if (state.settleFrames > 0) {
      runRelaxPasses(state.pointerDown ? 1 : 2, 0.155);
      state.settleFrames--;
    }

    // Decay pointer stroke speed cleanly when mouse stops moving while held down
    if (state.pointerDown && (nowMs - state.lastMoveTime) > 55) {
      state.strokeSpeed *= Math.pow(0.004, dt);
    }

    // 5) Render Photorealistic Karesansui Frame (WebGL2)
    packStoneUniforms();
    const sunDir = getSunDir();

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.useProgram(progRender);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sandA.tex);
    gl.uniform1i(uRender.uSandTex, 0);

    gl.uniform2f(uRender.uBedSize, world.bedW, world.bedH);
    gl.uniform2f(uRender.uTexel, 1 / world.simW, 1 / world.simH);
    gl.uniform2f(uRender.uFrameDim, world.frameW, world.frameH);
    gl.uniform2f(uRender.uResolution, glCanvas.width, glCanvas.height);
    gl.uniform1f(uRender.uTime, nowMs * 0.001);

    gl.uniform3fv(uRender.uCamPos, cam.pos);
    gl.uniform3fv(uRender.uCamForward, cam.forward);
    gl.uniform3fv(uRender.uCamRight, cam.right);
    gl.uniform3fv(uRender.uCamUp, cam.up);
    gl.uniform1f(uRender.uTanHalfFov, cam.tanHalfFov);
    gl.uniform1f(uRender.uAspect, cam.aspect);

    gl.uniform3fv(uRender.uSunDir, sunDir);
    gl.uniform3fv(uRender.uSunColor, state.curSunCol);
    gl.uniform3fv(uRender.uSkyColor, state.curSkyCol);
    gl.uniform3fv(uRender.uBounceColor, state.curBounceCol);
    gl.uniform1f(uRender.uWetness, state.curWetness);
    gl.uniform1f(uRender.uExposure, state.curExposure);
    gl.uniform1f(uRender.uKomorebi, state.curKomorebiStr);

    gl.uniform1i(uRender.uStoneCount, state.stones.length);
    gl.uniform4fv(uRender.uStoneA, stoneBufA);
    gl.uniform4fv(uRender.uStoneB, stoneBufB);
    gl.uniform4fv(uRender.uStoneC, stoneBufC);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // 6) Render 2D Overlay FX (Kicked Grains, Drifting Maple Leaves, Sweeper Beam, Rake Ghost)
    stepAndRenderFX(dt, nowMs);

    // 7) Update Procedural Granular Soundscape
    updateAudio(nowMs, dt);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
