<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141311" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Karesansui — Dry Landscape Sand Garden</title>
  <meta name="description" content="A physically simulated Japanese dry-landscape zen sand garden: mass-conserving Shirakawa gravel, angle-of-repose avalanches, raymarched mossy granite boulders, raking sunlight, and granular acoustic foley." />
  <style>
    :root {
      --bg: #12110f;
      --ink: rgba(244, 239, 230, 0.92);
      --ink-muted: rgba(224, 215, 200, 0.62);
      --ink-faint: rgba(212, 200, 182, 0.36);
      --panel: rgba(20, 18, 15, 0.66);
      --panel-strong: rgba(22, 19, 16, 0.84);
      --border: rgba(235, 224, 204, 0.14);
      --border-strong: rgba(235, 224, 204, 0.30);
      --accent: #d8c39e;
      --accent-soft: rgba(216, 195, 158, 0.18);
      --moss: #8ea56c;
      --serif: ui-serif, 'New York', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      overscroll-behavior: none;
    }

    #glCanvas, #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #glCanvas {
      z-index: 1;
      cursor: none;
    }

    #glCanvas.cursor-grab {
      cursor: grab;
    }

    #glCanvas.cursor-grabbing {
      cursor: grabbing;
    }

    #fxCanvas {
      z-index: 2;
      pointer-events: none;
    }

    /* ── Top Floating Chrome ── */
    .back {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(238, 231, 218, 0.76);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      touch-action: manipulation;
      transition: opacity 0.55s var(--ease), color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .back:hover,
    .back:focus-visible {
      color: rgba(250, 246, 238, 0.98);
      background: var(--panel-strong);
      border-color: var(--border-strong);
      outline: none;
    }

    .back::before {
      content: "\2190";
      letter-spacing: 0;
    }

    .top-right {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.55s var(--ease);
    }

    .title-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .title-pill .en {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(242, 235, 223, 0.85);
    }

    .title-pill .jp {
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--accent);
      opacity: 0.85;
    }

    .icon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .icon-pill:hover,
    .icon-pill:focus-visible {
      color: var(--ink);
      background: var(--panel-strong);
      border-color: var(--border-strong);
      outline: none;
    }

    .icon-pill.is-active {
      color: var(--accent);
      border-color: rgba(216, 195, 158, 0.42);
      background: rgba(34, 29, 23, 0.78);
    }

    .icon-pill svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Bottom Instrument Dock ── */
    .dock-wrap {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 20px);
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
    }

    .hint-line {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(240, 232, 218, 0.76);
      background: rgba(18, 16, 13, 0.56);
      border: 1px solid rgba(235, 224, 204, 0.12);
      padding: 5px 12px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.9s var(--ease);
    }

    .hint-line.is-hidden {
      opacity: 0;
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 248, 235, 0.06);
      overflow-x: auto;
      max-width: calc(100vw - 20px);
      scrollbar-width: none;
    }

    .dock::-webkit-scrollbar {
      display: none;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .tool-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .tool-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .tool-btn:hover,
    .tool-btn:focus-visible {
      color: var(--ink);
      background: rgba(255, 248, 235, 0.06);
      outline: none;
    }

    .tool-btn.is-active {
      color: #faf4e8;
      background: var(--accent-soft);
      border-color: rgba(216, 195, 158, 0.42);
    }

    .tool-btn.icon-only {
      padding: 0 9px;
    }

    /* ── Popover Drawer (Light / Garden Presets / Stone Controls) ── */
    .popover {
      position: fixed;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 54px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 35;
      min-width: 280px;
      max-width: calc(100vw - 24px);
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--panel-strong);
      border: 1px solid var(--border-strong);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 20px 54px rgba(0, 0, 0, 0.56);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .popover.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .pop-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .pop-sub {
      font-family: var(--serif);
      font-style: italic;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .pop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .pop-grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .pop-choice {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(255, 248, 235, 0.03);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .pop-choice:hover {
      background: rgba(255, 248, 235, 0.08);
      border-color: var(--border-strong);
    }

    .pop-choice.is-active {
      background: var(--accent-soft);
      border-color: rgba(216, 195, 158, 0.55);
    }

    .pop-choice .name {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pop-choice .meta {
      font-family: var(--serif);
      font-style: italic;
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    .slider-row {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .slider-item {
      display: grid;
      grid-template-columns: 78px 1fr 40px;
      align-items: center;
      gap: 10px;
    }

    .slider-item label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .slider-item .val {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 99px;
      background: rgba(235, 224, 204, 0.2);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #1b1814;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #1b1814;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    .toggle-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip-btn {
      flex: 1;
      min-width: 90px;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(255, 248, 235, 0.03);
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn:hover {
      color: var(--ink);
      border-color: var(--border-strong);
    }

    .chip-btn.is-active {
      color: #faf4e8;
      background: var(--accent-soft);
      border-color: rgba(216, 195, 158, 0.5);
    }

    /* ── Receding HUD during active raking or Zen mode ── */
    body.is-raking .dock-wrap,
    body.is-raking .top-right,
    body.is-raking .back {
      opacity: 0.22;
      pointer-events: none;
    }

    body.zen-mode .back,
    body.zen-mode .dock-wrap,
    body.zen-mode .popover,
    body.zen-mode .title-pill,
    body.zen-mode #audioBtn,
    body.zen-mode #viewBtn {
      opacity: 0;
      pointer-events: none;
    }

    body.zen-mode #zenBtn {
      opacity: 0.32;
    }

    body.zen-mode #zenBtn:hover {
      opacity: 0.92;
    }

    /* ── Stone Mode Helper Pill ── */
    .mode-banner {
      position: fixed;
      top: max(58px, calc(env(safe-area-inset-top) + 42px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(20, 18, 15, 0.72);
      border: 1px solid rgba(216, 195, 158, 0.30);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-banner.show {
      opacity: 1;
    }

    @media (max-width: 820px) {
      .title-pill { display: none; }
      .tool-btn .lbl { display: none; }
      .tool-btn { padding: 0 9px; height: 34px; }
      .tool-btn.keep-lbl .lbl { display: inline; }
      .hint-line { font-size: 9px; letter-spacing: 0.1em; }
      .pop-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .fallback-msg {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #141311;
      color: var(--ink);
      font-family: var(--serif);
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <a class="back" href="index.html">return to log</a>

  <div class="top-right">
    <div class="title-pill" aria-hidden="true">
      <span class="en">Karesansui</span>
      <span class="jp">枯山水</span>
    </div>
    <button type="button" class="icon-pill" id="viewBtn" title="Toggle Perspective (V)" aria-label="Toggle camera angle">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span id="viewLabel">Plan</span>
    </button>
    <button type="button" class="icon-pill is-active" id="audioBtn" title="Toggle Sound (M)" aria-label="Toggle granular sound">
      <svg id="audioIconOn" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.8 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="audioIconOff" viewBox="0 0 24 24" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
    </button>
    <button type="button" class="icon-pill" id="zenBtn" title="Zen View (H)" aria-label="Hide interface">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      <span>Zen</span>
    </button>
  </div>

  <div class="mode-banner" id="modeBanner"></div>

  <!-- Popover: Light & Atmosphere -->
  <div class="popover" id="lightPopover" role="dialog" aria-label="Lighting and Atmosphere">
    <div class="pop-head">
      <span class="pop-title">Light &amp; Weather</span>
      <span class="pop-sub">raking illumination</span>
    </div>
    <div class="pop-grid cols-4" id="lightChoices">
      <button type="button" class="pop-choice is-active" data-light="morning">
        <span class="name">Morning</span>
        <span class="meta">crisp dawn</span>
      </button>
      <button type="button" class="pop-choice" data-light="golden">
        <span class="name">Golden</span>
        <span class="meta">low amber</span>
      </button>
      <button type="button" class="pop-choice" data-light="mist">
        <span class="name">Mist</span>
        <span class="meta">soft rain</span>
      </button>
      <button type="button" class="pop-choice" data-light="moon">
        <span class="name">Moon</span>
        <span class="meta">quiet silver</span>
      </button>
    </div>
    <div class="slider-row">
      <div class="slider-item">
        <label for="sunAzimuth">Azimuth</label>
        <input type="range" id="sunAzimuth" min="0" max="360" step="1" value="34" />
        <span class="val" id="sunAzimuthVal">34°</span>
      </div>
      <div class="slider-item">
        <label for="sunElevation">Elevation</label>
        <input type="range" id="sunElevation" min="11" max="54" step="1" value="23" />
        <span class="val" id="sunElevationVal">23°</span>
      </div>
    </div>
    <div class="toggle-row">
      <button type="button" class="chip-btn is-active" id="komorebiToggle">Komorebi Canopy</button>
      <button type="button" class="chip-btn is-active" id="leavesToggle">Maple Leaves</button>
    </div>
  </div>

  <!-- Popover: Classic Temple Gardens -->
  <div class="popover" id="gardenPopover" role="dialog" aria-label="Garden Compositions">
    <div class="pop-head">
      <span class="pop-title">Compositions</span>
      <span class="pop-sub">traditional karesansui</span>
    </div>
    <div class="pop-grid" id="gardenChoices">
      <button type="button" class="pop-choice is-active" data-preset="ryoanji">
        <span class="name">Ryōan-ji</span>
        <span class="meta">five stones &amp; sea rings</span>
      </button>
      <button type="button" class="pop-choice" data-preset="sazanami">
        <span class="name">Sazanami</span>
        <span class="meta">gentle undulating tide</span>
      </button>
      <button type="button" class="pop-choice" data-preset="uzumaki">
        <span class="name">Uzumaki</span>
        <span class="meta">twin spirals in gravel</span>
      </button>
      <button type="button" class="pop-choice" data-preset="blank">
        <span class="name">Fresh Bed</span>
        <span class="meta">combed clean slate</span>
      </button>
    </div>
  </div>

  <!-- Bottom Floating Dock -->
  <div class="dock-wrap">
    <div class="hint-line" id="hintLine">Drag to rake &middot; Shift for straight rows &middot; Alt to orbit stones</div>
    <div class="dock" role="toolbar" aria-label="Zen garden tools">
      <div class="dock-group" id="toolGroup">
        <button type="button" class="tool-btn is-active" data-tool="rake" title="Wide Cedar Rake — 5 tines (1)">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="5" y1="6" x2="5" y2="18"/><line x1="8.5" y1="6" x2="8.5" y2="18"/><line x1="12" y1="6" x2="12" y2="18"/><line x1="15.5" y1="6" x2="15.5" y2="18"/><line x1="19" y1="6" x2="19" y2="18"/></svg>
          <span class="lbl">Rake</span>
        </button>
        <button type="button" class="tool-btn" data-tool="fine" title="Fine Bamboo Comb — 7 tines (2)">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="4.5" y1="6" x2="4.5" y2="17"/><line x1="7" y1="6" x2="7" y2="17"/><line x1="9.5" y1="6" x2="9.5" y2="17"/><line x1="12" y1="6" x2="12" y2="17"/><line x1="14.5" y1="6" x2="14.5" y2="17"/><line x1="17" y1="6" x2="17" y2="17"/><line x1="19.5" y1="6" x2="19.5" y2="17"/></svg>
          <span class="lbl">Fine</span>
        </button>
        <button type="button" class="tool-btn" data-tool="wave" title="Deep Wave Rake — 3 broad tines (3)">

<script>
(() => {

    if (!extFloat && !extHalfFloat) return false;

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(tex);
    return ok;
  }

  /* ==========================================================================
