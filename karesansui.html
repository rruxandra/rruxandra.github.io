  const QUAD_VS = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID & 1) << 2) - 1.0, float((gl_VertexID & 2) << 1) - 1.0);
  vUv = p * 0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}
`;

  const COMMON_PACK_GLSL = USE_FLOAT_FBO ? `
vec4 unpackSand(vec4 raw) {
  return raw;
}
vec4 packSand(float h, float fresh, vec2 flow) {
  return vec4(h, clamp(fresh, 0.0, 1.0), clamp(flow, -1.0, 1.0));
}
vec4 sampleSand(sampler2D tex, vec2 uv) {
  return texture(tex, clamp(uv, vec2(0.0005), vec2(0.9995)));
}
` : `
const float H_MIN = -4.5;
const float H_RANGE = 11.0;
vec4 unpackSand(vec4 raw) {
  float h01 = raw.r + raw.g / 255.0;
  float h = H_MIN + h01 * H_RANGE;
  vec2 flow = raw.ba * 2.0 - 1.0;
  float fresh = clamp(length(flow), 0.0, 1.0);
  return vec4(h, fresh, flow);
}
vec4 packSand(float h, float fresh, vec2 flow) {
  float h01 = clamp((h - H_MIN) / H_RANGE, 0.0, 0.9999);
  float hi = floor(h01 * 255.0) / 255.0;
  float lo = fract(h01 * 255.0);
  vec2 fl = clamp(flow, -1.0, 1.0) * 0.5 + 0.5;
  return vec4(hi, lo, fl.x, fl.y);
}
vec4 sampleSand(sampler2D tex, vec2 uv) {
  vec2 sz = vec2(textureSize(tex, 0));
  vec2 fc = clamp(uv, vec2(0.0005), vec2(0.9995)) * sz - 0.5;
  vec2 f = fract(fc);
  vec2 b = (floor(fc) + 0.5) / sz;
  vec2 t = 1.0 / sz;
  vec4 s00 = unpackSand(texture(tex, b));
  vec4 s10 = unpackSand(texture(tex, b + vec2(t.x, 0.0)));
  vec4 s01 = unpackSand(texture(tex, b + vec2(0.0, t.y)));
  vec4 s11 = unpackSand(texture(tex, b + t));
  return mix(mix(s00, s10, f.x), mix(s01, s11, f.x), f.y);
}
`;

  const NOISE_GLSL = `
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

vec3 hash32(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float hash13(vec3 p3) {
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}

float vnoise2(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
    mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}

float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(
      mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), u.x),
      mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), u.x),
      u.y
    ),
    mix(
      mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), u.x),
      mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), u.x),
      u.y
    ),
    u.z
  );
}

float fbm2(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
  for (int i = 0; i < 4; i++) {
    v += a * vnoise2(p);
    p = m * p * 2.03 + vec2(17.1, 31.7);
    a *= 0.5;
  }
  return v;
}

float fbm3(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * vnoise3(p);
    p = p * 2.04 + vec3(13.7, 29.3, 47.1);
    a *= 0.5;
  }
  return v;
}
`;

  // ── SHADER 1: Preset Courtyard Initializer ──
  const PRESET_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform vec2 uBedSize;
uniform int uPreset;
uniform int uStoneCount;
uniform vec4 uStoneA[${MAX_STONES}];
uniform vec4 uStoneB[${MAX_STONES}];

${COMMON_PACK_GLSL}
${NOISE_GLSL}

// Crisp triangular-peaked Shirakawa ridge wave in [-1, 1]
float ridgeWave(float phase) {
  float tri = 1.0 - 2.0 * abs(fract(phase) - 0.5);
  // Sharpen crests gently while rounding troughs like wooden rake teeth
  return mix(-1.0, 1.0, pow(tri, 0.78));
}

float stoneContourDist(vec2 p, int idx) {
  vec2 d = p - uStoneA[idx].xy;
  float c = cos(-uStoneA[idx].z);
  float s = sin(-uStoneA[idx].z);
  vec2 q = vec2(c * d.x - s * d.y, s * d.x + c * d.y);
  vec2 rad = max(vec2(1.0), uStoneA[idx].w * uStoneB[idx].xy);
  // Approximate Euclidean distance outside rotated ellipse
  vec2 n = q / rad;
  float k0 = length(n);
  float k1 = length(n / rad);
  return k0 * (k0 - 1.0) / max(k1, 1e-4);
}

float sminDist(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

float stoneClusterField(vec2 p) {
  float d = 1e5;
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount) break;
    float sd = stoneContourDist(p, i);
    d = (i == 0) ? sd : sminDist(d, sd, 11.5);
  }
  return d;
}

void main() {
  vec2 P = (vUv - 0.5) * uBedSize;
  vec2 halfBed = uBedSize * 0.5;

  // Hard min distance for exact stone collar + smooth unified island contour for raked rings!
  float minSD = 1e5;
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount) break;
    minSD = min(minSD, stoneContourDist(P, i));
  }
  float clusterSD = stoneClusterField(P);
  vec2 eps = vec2(0.6, 0.0);
  vec2 stoneGrad = normalize(vec2(
    stoneClusterField(P + eps.xy) - stoneClusterField(P - eps.xy),
    stoneClusterField(P + eps.yx) - stoneClusterField(P - eps.yx)
  ) + vec2(1e-4, 0.0));

  // Distance from wooden garden frame
  vec2 edgeD = halfBed - abs(P);
  float minEdge = min(edgeD.x, edgeD.y);

  // Subtle hand-raked human organic tremor
  float handWobble = (fbm2(P * 0.022 + 3.1) - 0.5) * 0.65;
  float microGrain = (vnoise2(P * 0.65) - 0.5) * 0.08;

  float h = 0.0;
  vec2 flow = vec2(1.0, 0.0);
  float fresh = 0.62;

  if (uPreset == 0) {
    // ── RYŌAN-JI: Classic Kyoto temple sea lines + flowing stone-island halos + framed perimeter ──
    float spacing = 3.7;
    float seaPhase = (P.y + handWobble * 1.15) / spacing;
    float seaH = ridgeWave(seaPhase) * 0.94;
    vec2 seaFlow = vec2(1.0, 0.0);

    // Unified smooth concentric rings embracing each stone cluster (4 crisp rings)
    float ringSpan = spacing * 4.05;
    float ringPhase = (clusterSD + handWobble * 0.40) / spacing;
    float ringH = ridgeWave(ringPhase) * 1.02;
    vec2 ringFlow = vec2(-stoneGrad.y, stoneGrad.x);

    // Crisp hand-raked outer rim cutting cleanly across the straight sea lines
    float ringMask = 1.0 - smoothstep(ringSpan - 0.95, ringSpan + 0.75, clusterSD);
    float outerCrest = exp(-pow((clusterSD - ringSpan + 0.45) / 1.15, 2.0)) * 0.24;
    h = mix(seaH, ringH, ringMask) + outerCrest;
    flow = normalize(mix(seaFlow, ringFlow, ringMask) + vec2(1e-4, 0.0));

    // Classic fuchidori perimeter border (2 crisp parallel grooves hugging the timber wall)
    float borderSpan = spacing * 2.1;
    if (minEdge < borderSpan + 1.5) {
      float bMask = 1.0 - smoothstep(borderSpan - 0.9, borderSpan + 0.85, minEdge);
      float bH = ridgeWave((minEdge + handWobble * 0.25) / spacing) * 0.86;
      vec2 bFlow = (edgeD.x < edgeD.y) ? vec2(0.0, 1.0) : vec2(1.0, 0.0);
      h = mix(h, bH, bMask * (1.0 - ringMask * 0.85));
      flow = normalize(mix(flow, bFlow, bMask * (1.0 - ringMask * 0.85)) + vec2(1e-4, 0.0));
    }
  } else if (uPreset == 1) {
    // ── SAZANAMI: Gentle sinusoidal ocean tide flowing around reclining stones ──
    float spacing = 4.2;
    float waveY = P.y + sin(P.x * 0.055) * 6.5 + sin(P.x * 0.024 + 1.2) * 3.8 + handWobble;
    float dWaveDx = cos(P.x * 0.055) * 6.5 * 0.055 + cos(P.x * 0.024 + 1.2) * 3.8 * 0.024;
    vec2 seaFlow = normalize(vec2(1.0, -dWaveDx));
    float seaH = ridgeWave(waveY / spacing) * 1.00;

    float ringSpan = spacing * 3.1;
    float ringMask = 1.0 - smoothstep(ringSpan - 1.0, ringSpan + 0.8, clusterSD);
    float ringH = ridgeWave((clusterSD + handWobble * 0.35) / 3.6) * 0.98;
    vec2 ringFlow = vec2(-stoneGrad.y, stoneGrad.x);

    h = mix(seaH, ringH, ringMask);
    flow = normalize(mix(seaFlow, ringFlow, ringMask) + vec2(1e-4, 0.0));
  } else if (uPreset == 2) {
    // ── UZUMAKI: Twin interlocking spirals & sweeping river arcs ──
    vec2 c1 = (uStoneCount > 0) ? uStoneA[0].xy : vec2(-42.0, 6.0);
    vec2 c2 = (uStoneCount > 1) ? uStoneA[1].xy : vec2(46.0, -8.0);
    vec2 v1 = P - c1;
    vec2 v2 = P - c2;
    float r1 = length(v1);
    float r2 = length(v2);
    float a1 = atan(v1.y, v1.x);
    float a2 = atan(v2.y, v2.x);
    float sp = 3.85;
    float w1 = ridgeWave((r1 + a1 * (sp / 6.2831853) + handWobble * 0.35) / sp) * 0.94;
    float w2 = ridgeWave((r2 - a2 * (sp / 6.2831853) + handWobble * 0.35) / sp) * 0.94;
    float blend = smoothstep(-10.0, 10.0, r1 - r2);
    vec2 f1 = normalize(vec2(-v1.y, v1.x) + vec2(1e-4, 0.0));
    vec2 f2 = normalize(vec2(v2.y, -v2.x) + vec2(1e-4, 0.0));
    h = mix(w1, w2, blend);
    flow = normalize(mix(f1, f2, blend) + vec2(1e-4, 0.0));
  } else {
    // ── FRESH BED: Immaculate hand-leveled white Shirakawa gravel ──
    h = (fbm2(P * 0.035) - 0.5) * 0.22 + sin(P.y * 1.45 + handWobble) * 0.035;
    flow = vec2(1.0, 0.0);
    fresh = 0.25;
  }

  // Raised subtle gravel collar hugging stone bases + snug basin under stones
  if (minSD < 4.5) {
    float collar = exp(-pow((minSD - 0.7) / 1.8, 2.0)) * 0.52;
    float under = smoothstep(0.6, -2.5, minSD);
    h = mix(h + collar, -0.65, under);
  }

  // Natural slightly banked gravel edge against the timber frame
  float wallBank = exp(-minEdge * 0.32) * 0.36;
  h += wallBank + microGrain;

  fragColor = packSand(h, fresh, flow);
}
`;

  // ── SHADER 2: Mass-Conserving Rake, Smooth, Sweeper, Stone & Raindrop Physics ──
  const RAKE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSandTex;
uniform vec2 uBedSize;
uniform vec2 uP0;
uniform vec2 uP1;
uniform vec2 uN0;
uniform vec2 uN1;
uniform int uMode;       // 0=multi-tine rake, 1=stylus, 2=smooth board, 3=sweeper, 4=stoneDrag, 5=raindrop
uniform int uTineCount;
uniform float uSpacing;
uniform float uHalfW;
uniform float uDepth;
uniform float uStrength;
uniform float uTime;

uniform int uStoneCount;
uniform vec4 uStoneA[${MAX_STONES}];
uniform vec4 uStoneB[${MAX_STONES}];
uniform int uActiveStone;

${COMMON_PACK_GLSL}
${NOISE_GLSL}

vec2 worldToUv(vec2 p) {
  return p / uBedSize + 0.5;
}

float stoneMaskAt(vec2 p, int skipIdx) {
  float minD = 1e5;
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount || i == skipIdx) break;
    vec2 d = p - uStoneA[i].xy;
    float c = cos(-uStoneA[i].z);
    float s = sin(-uStoneA[i].z);
    vec2 q = vec2(c * d.x - s * d.y, s * d.x + c * d.y);
    vec2 rad = max(vec2(1.0), uStoneA[i].w * uStoneB[i].xy);
    vec2 n = q / rad;
    float k0 = length(n);
    float k1 = length(n / rad);
    float sd = k0 * (k0 - 1.0) / max(k1, 1e-4);
    minD = min(minD, sd);
  }
  return smoothstep(-0.3, 1.4, minD);
}

void main() {
  vec2 P = (vUv - 0.5) * uBedSize;
  vec4 cur = sampleSand(uSandTex, vUv);
  float h = cur.r;
  float fresh = cur.g;
  vec2 flow = cur.ba;

  if (uMode == 0 || uMode == 1) {
    // ── MULTI-TINE RAKE OR BAMBOO STYLUS (MASS-CONSERVING DISPLACEMENT) ──
    float sMask = stoneMaskAt(P, -1);
    if (sMask > 0.001) {
      float halfSpan = 0.5 * float(uTineCount - 1);
      float bestCut = 0.0;
      float bestCutTarget = h;
      float bermAdd = 0.0;
      float bowAdd = 0.0;
      vec2 bestDir = flow;
      float flowW = 0.0;
      float disturb = 0.0;

      // Local baseline height (keeps cross-raking grounded without drifting)
      vec2 tx = vec2(max(uSpacing, 2.8)) / uBedSize;
      float hAvg = 0.25 * (
        sampleSand(uSandTex, vUv + vec2(tx.x, 0.0)).r +
        sampleSand(uSandTex, vUv - vec2(tx.x, 0.0)).r +
        sampleSand(uSandTex, vUv + vec2(0.0, tx.y)).r +
        sampleSand(uSandTex, vUv - vec2(0.0, tx.y)).r
      );
      float refH = mix(0.0, hAvg, 0.42);

      // Subtle stone-to-stone micro jitter for natural wood-grain imperfection
      float grainJit = (vnoise2(P * 0.55) - 0.5) * 0.06;

      for (int k = 0; k < 7; k++) {
        if (k >= uTineCount) break;
        float off = (float(k) - halfSpan) * uSpacing;
        vec2 a = uP0 + uN0 * off;
        vec2 b = uP1 + uN1 * off;
        vec2 ab = b - a;
        float len2 = dot(ab, ab);
        float len = sqrt(max(len2, 1e-6));
        float t = clamp(dot(P - a, ab) / max(len2, 1e-6), 0.0, 1.0);
        vec2 Q = a + ab * t;
        float d = length(P - Q);
        vec2 dir = (len > 1e-4) ? (ab / len) : vec2(-uN1.y, uN1.x);

        float u = d / uHalfW;
        if (u < 2.55) {
          float hCenter = sampleSand(uSandTex, worldToUv(Q)).r;
          float floorCenter = refH - uDepth;
          float centerCarved = max(0.0, hCenter - floorCenter);

          // 1) Inside wooden tine tooth: carve rounded V-trough
          if (u < 1.05) {
            float cutProf = clamp(1.0 - u * u, 0.0, 1.0);
            cutProf = pow(cutProf, 0.85);
            float targetFloor = refH - uDepth * cutProf + grainJit;
            if (cutProf > bestCut) {
              bestCut = cutProf;
              bestCutTarget = targetFloor;
              bestDir = dir;
            }
            flowW = max(flowW, cutProf * 0.92);
            disturb = max(disturb, cutProf);
          }

          // 2) Lateral displaced berms pushed symmetrically onto both flanks
          if (u >= 0.78 && u < 2.28) {
            float bu = clamp((u - 0.78) / 1.50, 0.0, 1.0);
            float bermProf = pow(sin(bu * 3.14159265), 1.22);
            bermAdd += centerCarved * bermProf * 0.66;
            flowW = max(flowW, bermProf * 0.68);
            bestDir = (flowW > 0.0) ? mix(bestDir, dir, bermProf * 0.5) : dir;
            disturb = max(disturb, bermProf * 0.9);
          }

          // 3) Forward bow-wave pushed just ahead of moving tine tip
          float ahead = dot(P - b, dir);
          float side = abs(dot(P - b, vec2(-dir.y, dir.x)));
          if (ahead > 0.0 && ahead < uHalfW * 2.1 && side < uHalfW * 1.45) {
            float fw = sin((ahead / (uHalfW * 2.1)) * 3.14159265) * (1.0 - side / (uHalfW * 1.45));
            bowAdd += centerCarved * fw * 0.28 * clamp(len * 0.45, 0.0, 1.0);
            disturb = max(disturb, fw * 0.75);
          }
        }
      }

      if (bestCut > 0.001) {
        // Carve down toward target floor cleanly without over-digging
        float carved = max(0.0, h - bestCutTarget);
        h -= carved * clamp(uStrength * (0.76 + 0.24 * bestCut), 0.0, 0.98) * sMask;
      }

      if (bermAdd > 0.0001 || bowAdd > 0.0001) {
        // Soft ceiling prevents piling infinite sand on repeated passes
        float headroom = clamp((2.65 - h) / 2.2, 0.0, 1.0);
        h += (bermAdd + bowAdd) * headroom * uStrength * sMask;
      }

      if (flowW > 0.001) {
        vec2 nf = mix(flow, bestDir, clamp(flowW * sMask, 0.0, 0.92));
        float fl = length(nf);
        flow = (fl > 1e-4) ? nf / fl : bestDir;
      }
      fresh = max(fresh, disturb * sMask);
    }
  } else if (uMode == 2) {
    // ── NARASHI SMOOTHING BOARD (PLANAR SCREEDING) ──
    float sMask = stoneMaskAt(P, -1);
    vec2 ab = uP1 - uP0;
    float len2 = dot(ab, ab);
    float len = sqrt(max(len2, 1e-6));
    float t = clamp(dot(P - uP0, ab) / max(len2, 1e-6), 0.0, 1.0);
    vec2 Q = uP0 + ab * t;
    vec2 dir = (len > 1e-4) ? (ab / len) : vec2(-uN1.y, uN1.x);
    vec2 perp = vec2(-dir.y, dir.x);

    float across = abs(dot(P - Q, perp));
    float along = length(P - Q - perp * dot(P - Q, perp));
    float wAcross = smoothstep(uHalfW, uHalfW * 0.68, across);
    float wAlong = smoothstep(2.6, 0.6, along);
    float mask = wAcross * wAlong * sMask;

    if (mask > 0.001) {
      vec2 off = vec2(2.6) / uBedSize;
      float avg = 0.25 * (
        sampleSand(uSandTex, vUv + vec2(off.x, 0.0)).r +
        sampleSand(uSandTex, vUv - vec2(off.x, 0.0)).r +
        sampleSand(uSandTex, vUv + vec2(0.0, off.y)).r +
        sampleSand(uSandTex, vUv - vec2(0.0, off.y)).r
      );
      float striation = sin(dot(P, perp) * 2.2 + vnoise2(P * 0.2) * 2.0) * 0.035;
      float targetH = mix(avg, 0.0, 0.42) + striation;
      h = mix(h, targetH, mask * 0.56);
      flow = normalize(mix(flow, dir, mask * 0.72) + vec2(1e-4, 0.0));
      fresh = mix(fresh, 0.38, mask * 0.5);
    }
  } else if (uMode == 3) {
    // ── ANIMATED FULL-GARDEN WOODEN SWEEPER BAR ──
    float sMask = stoneMaskAt(P, -1);
    float x0 = uP0.x;
    float x1 = uP1.x;
    // Behind advancing bar: freshly leveled sand with delicate cedar comb lines
    if (P.x >= x0 - 4.0 && P.x <= x1 + 0.5) {
      float stria = sin(P.y * 1.65 + fbm2(P * 0.04) * 2.2) * 0.045;
      float gentle = (fbm2(P * 0.032 + uTime * 0.01) - 0.5) * 0.14;
      float targetH = stria + gentle;
      h = mix(h, targetH, 0.96 * sMask);
      flow = normalize(mix(flow, vec2(1.0, 0.0), 0.92 * sMask) + vec2(1e-4, 0.0));
      fresh = mix(fresh, 0.48, 0.78 * sMask);
    } else if (P.x > x1 + 0.5 && P.x < x1 + 8.5) {
      // Visible rolling sand bow-wave pushed just ahead of the cedar beam
      float bw = sin(((P.x - x1 - 0.5) / 8.0) * 3.14159265);
      h += bw * 0.24 * sMask * clamp((2.6 - h) / 2.2, 0.0, 1.0);
      fresh = max(fresh, bw * 0.92 * sMask);
    }
  } else if (uMode == 4 && uActiveStone >= 0) {
    // ── DRAGGING / PLACING A BOULDER: BOW WAVE & NESTED COLLAR ──
    vec4 sA = uStoneA[uActiveStone];
    vec4 sB = uStoneB[uActiveStone];
    vec2 move = uP1 - uP0;
    float mLen = length(move);
    vec2 mDir = (mLen > 1e-3) ? (move / mLen) : vec2(1.0, 0.0);

    vec2 d = P - sA.xy;
    float c = cos(-sA.z);
    float s = sin(-sA.z);
    vec2 q = vec2(c * d.x - s * d.y, s * d.x + c * d.y);
    vec2 rad = max(vec2(1.0), sA.w * sB.xy);
    vec2 n = q / rad;
    float k0 = length(n);
    float k1 = length(n / rad);
    float sd = k0 * (k0 - 1.0) / max(k1, 1e-4);

    // Depress sand smoothly under stone
    if (sd < 0.8) {
      float dep = smoothstep(0.8, -2.5, sd);
      h = mix(h, -0.85, dep * 0.45);
      fresh = max(fresh, dep * 0.8);
    }
    // Push raised gravel collar around stone perimeter, stronger on leading side
    if (sd >= -0.4 && sd < 6.2) {
      float ring = exp(-pow((sd - 1.5) / 2.1, 2.0));
      float lead = 0.55 + 0.65 * max(0.0, dot(normalize(d + vec2(1e-4, 0.0)), mDir));
      float push = (0.14 + 0.24 * clamp(mLen * 0.35, 0.0, 1.0)) * ring * lead;
      float headroom = clamp((2.8 - h) / 2.4, 0.0, 1.0);
      h += push * headroom;
      fresh = max(fresh, ring * 0.85);
    }
  } else if (uMode == 5) {
    // ── MIST / RAIN MICRO-CRATER IMPULSE ──
    float d = length(P - uP1);
    float r = uHalfW;
    if (d < r * 2.2) {
      float u = d / r;
      float pit = exp(-u * u * 2.4) * uDepth;
      float rim = exp(-pow((u - 1.15) / 0.45, 2.0)) * uDepth * 0.46;
      h += rim - pit;
      fresh = max(fresh, exp(-u * u) * 0.65);
    }
  }

  h = clamp(h, -3.8, 5.0);
  fragColor = packSand(h, fresh, flow);
}
`;

  // ── SHADER 3: Mass-Conserving Angle-of-Repose Granular Avalanche Relaxation ──
  const RELAX_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSandTex;
uniform vec2 uBedSize;
uniform vec2 uTexel;
uniform float uRate;

${COMMON_PACK_GLSL}
${NOISE_GLSL}

void main() {
  vec4 center = sampleSand(uSandTex, vUv);
  float h = center.r;
  float fresh = center.g;
  vec2 flow = center.ba;

  vec2 P = (vUv - 0.5) * uBedSize;
  vec2 dCm = uTexel * uBedSize;
  float dx = dCm.x;
  float dy = dCm.y;
  float dd = length(dCm);

  // Crushed angular Shirakawa granite angle of repose (~38 deg -> tan ~ 0.79)
  // Modulated subtly by grain roughness for crisp organic ridges
  float talus = 0.79 + (hash12(floor(P * 2.4)) - 0.5) * 0.10;

  float hL = sampleSand(uSandTex, vUv + vec2(-uTexel.x, 0.0)).r;
  float hR = sampleSand(uSandTex, vUv + vec2( uTexel.x, 0.0)).r;
  float hD = sampleSand(uSandTex, vUv + vec2(0.0, -uTexel.y)).r;
  float hU = sampleSand(uSandTex, vUv + vec2(0.0,  uTexel.y)).r;

  float hLD = sampleSand(uSandTex, vUv + vec2(-uTexel.x, -uTexel.y)).r;
  float hRD = sampleSand(uSandTex, vUv + vec2( uTexel.x, -uTexel.y)).r;
  float hLU = sampleSand(uSandTex, vUv + vec2(-uTexel.x,  uTexel.y)).r;
  float hRU = sampleSand(uSandTex, vUv + vec2( uTexel.x,  uTexel.y)).r;

  float netFlux = 0.0;
  float limX = talus * dx;
  float limY = talus * dy;
  float limD = talus * dd;

  // Symmetric pairwise avalanche flux guarantees mass conservation
  float dL = hL - h; netFlux += (abs(dL) > limX) ? sign(dL) * (abs(dL) - limX) : 0.0;
  float dR = hR - h; netFlux += (abs(dR) > limX) ? sign(dR) * (abs(dR) - limX) : 0.0;
  float dD = hD - h; netFlux += (abs(dD) > limY) ? sign(dD) * (abs(dD) - limY) : 0.0;
  float dU = hU - h; netFlux += (abs(dU) > limY) ? sign(dU) * (abs(dU) - limY) : 0.0;

  float dLD = hLD - h; netFlux += (abs(dLD) > limD) ? 0.707 * sign(dLD) * (abs(dLD) - limD) : 0.0;
  float dRD = hRD - h; netFlux += (abs(dRD) > limD) ? 0.707 * sign(dRD) * (abs(dRD) - limD) : 0.0;
  float dLU = hLU - h; netFlux += (abs(dLU) > limD) ? 0.707 * sign(dLU) * (abs(dLU) - limD) : 0.0;
  float dRU = hRU - h; netFlux += (abs(dRU) > limD) ? 0.707 * sign(dRU) * (abs(dRU) - limD) : 0.0;

  // Strictly static below angle of repose: only apply tiny anti-aliasing where grains actually avalanche!
  if (abs(netFlux) > 0.0002) {
    float lap = (hL + hR + hD + hU - 4.0 * h);
    h += uRate * netFlux + 0.006 * lap;
  }
  h = clamp(h, -3.8, 5.0);

  fragColor = packSand(h, fresh, flow);
}
`;

  // ── SHADER 4: Photorealistic Raymarched Karesansui Display Shader ──
  const RENDER_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSandTex;
uniform vec2 uBedSize;
uniform vec2 uTexel;
uniform vec2 uFrameDim; // (frameWidthCm, frameHeightCm)
uniform vec2 uResolution;
uniform float uTime;

// Camera
uniform vec3 uCamPos;
uniform vec3 uCamForward;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform float uTanHalfFov;
uniform float uAspect;

// Lighting & Atmosphere
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyColor;
uniform vec3 uBounceColor;
uniform float uWetness;
uniform float uExposure;
uniform float uKomorebi;

// 3D Zen Stones
uniform int uStoneCount;
uniform vec4 uStoneA[${MAX_STONES}]; // (x, y, rot, scaleR)
uniform vec4 uStoneB[${MAX_STONES}]; // (ax, ay, hz, seed)
uniform vec4 uStoneC[${MAX_STONES}]; // (moss, flatness, sink, highlight)

${COMMON_PACK_GLSL}
${NOISE_GLSL}

// ── Smooth Min/Max for Sculptural Rock Facets ──
float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

float smax(float a, float b, float k) {
  return -smin(-a, -b, k);
}

// ── Fast 2x2 Cellular Voronoi for Real Millimeter Shirakawa Granite Pebbles ──
// Returns: x = distance to nearest grain center, y = distance to grain edge (cavity), z = grain ID hash, w = secondary hash
vec4 pebbleCell(vec2 p) {
  vec2 n = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  vec2 bestCell = vec2(0.0);
  vec2 bestDiff = vec2(0.0);

  // 3x3 only in tight 2x2 neighborhood around nearest corner -> 4 taps!
  vec2 oBase = step(vec2(0.5), f) - 1.0;
  for (int j = 0; j < 2; j++) {
    for (int i = 0; i < 2; i++) {
      vec2 g = oBase + vec2(float(i), float(j));
      vec2 cell = n + g;
      vec2 rnd = hash22(cell);
      vec2 diff = g + (0.14 + 0.72 * rnd) - f;
      float d = dot(diff, diff);
      if (d < d1) {
        d2 = d1;
        d1 = d;
        bestCell = cell;
        bestDiff = diff;
      } else if (d < d2) {
        d2 = d;
      }
    }
  }
  float edge = sqrt(d2) - sqrt(d1);
  vec2 id = hash22(bestCell + 19.31);
  return vec4(sqrt(d1), edge, id.x, id.y);
}

// Also return micro-normal offset of individual pebble facet
vec3 pebbleInfo(vec2 p, out vec2 facetSlope) {
  vec2 n = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  vec2 bestCell = vec2(0.0);
  vec2 bestDiff = vec2(0.0);
  vec2 oBase = step(vec2(0.5), f) - 1.0;
  for (int j = 0; j < 2; j++) {
    for (int i = 0; i < 2; i++) {
      vec2 g = oBase + vec2(float(i), float(j));
      vec2 cell = n + g;
      vec2 rnd = hash22(cell);
      vec2 diff = g + (0.15 + 0.70 * rnd) - f;
      float d = dot(diff, diff);
      if (d < d1) {
        d2 = d1;
        d1 = d;
        bestCell = cell;
        bestDiff = diff;
      } else if (d < d2) {
        d2 = d;
      }
    }
  }
  float edge = clamp((sqrt(d2) - sqrt(d1)) * 2.6, 0.0, 1.0);
  vec3 id = hash32(bestCell + 7.13);
  // Dome + tilted flat mineral crystal facet per pebble
  vec2 tilt = (id.yz - 0.5) * 0.72;
  facetSlope = -bestDiff * 0.95 + tilt;
  return vec3(edge, id.x, id.y);
}

// ── Sand Heightfield Helpers ──
vec2 worldToUv(vec2 p) {
  return p / uBedSize + 0.5;
}

float getSandH(vec2 p) {
  return sampleSand(uSandTex, worldToUv(p)).r;
}

// ── 3D Weathered Kyoto Granite Boulder SDF ──
float stoneSDF(vec3 p, int i) {
  vec4 sA = uStoneA[i];
  vec4 sB = uStoneB[i];
  vec4 sC = uStoneC[i];

  vec3 rel = p - vec3(sA.xy, -sC.z);
  float ca = cos(-sA.z);
  float sa = sin(-sA.z);
  vec3 lp = vec3(ca * rel.x - sa * rel.y, sa * rel.x + ca * rel.y, rel.z);

  vec3 rad = vec3(sA.w * sB.x, sA.w * sB.y, sB.z);
  vec3 q = lp / rad;

  // Natural geological lean/asymmetry seeded per boulder
  float sd = sB.w;
  float leanX = (fract(sd * 1.37) - 0.5) * 0.34;
  float leanY = (fract(sd * 2.91) - 0.5) * 0.34;
  q.x -= leanX * max(0.0, q.z);
  q.y -= leanY * max(0.0, q.z);

  // Broad anchored base, slightly tapered weathered crown
  float taper = 1.0 + 0.22 * clamp(q.z, -0.4, 1.1);
  vec3 qs = vec3(q.xy * taper, (q.z - 0.28) * 1.18);
  float d = length(qs) - 0.96;

  // Sculpt 5 crystalline granite cleavage planes (gives real angular temple rock silhouette!)
  float a0 = sd * 6.2831;
  for (int k = 0; k < 5; k++) {
    float fk = float(k);
    float ang = a0 + fk * 1.28 + sin(sd * 3.7 + fk) * 0.45;
    float pitch = 0.25 + 0.55 * fract(sd * (2.13 + fk * 0.77));
    vec3 pn = normalize(vec3(cos(ang) * cos(pitch), sin(ang) * cos(pitch), sin(pitch)));
    float offset = 0.66 + 0.22 * fract(sd * (4.17 + fk * 1.31));
    d = smax(d, dot(q - vec3(0.0, 0.0, 0.16), pn) - offset, 0.17);
  }

  // Optional slightly flat-topped stepping/reclining crown
  float topPlane = q.z - (0.94 - sC.y * 0.24);
  d = smax(d, topPlane, 0.16);

  // Stratified Kurama granite geological ridges & fissures
  float strata = sin((q.x * 3.4 + q.y * 2.1 + q.z * 7.2) + sd * 5.0 + vnoise3(q * 2.6 + sd) * 2.2);
  float macroRough = (vnoise3(q * 2.8 + vec3(sd * 3.1, sd * 1.7, sd * 2.3)) - 0.5) * 0.14;
  float medRough = (vnoise3(q * 6.4 + vec3(sd * 5.3)) - 0.5) * 0.055;
  d += macroRough + medRough - abs(strata) * 0.022;

  // Flat bottom anchor beneath gravel
  d = max(d, -q.z - 0.28);

  float minR = min(rad.x, min(rad.y, rad.z));
  return d * minR;
}

vec3 stoneNormal(vec3 p, int i) {
  float e = 0.12;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * stoneSDF(p + k.xyy * e, i) +
    k.yyx * stoneSDF(p + k.yyx * e, i) +
    k.yxy * stoneSDF(p + k.yxy * e, i) +
    k.xxx * stoneSDF(p + k.xxx * e, i)
  );
}

// Fast ray-sphere test (returns vec2(tNear, tFar), miss if x > y)
vec2 intersectSphere(vec3 ro, vec3 rd, vec3 center, float radius) {
  vec3 oc = ro - center;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - radius * radius;
  float h = b * b - c;
  if (h < 0.0) return vec2(1.0, -1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

// Ray-box intersection for Hinoki wooden frame
vec2 intersectBox(vec3 ro, vec3 rd, vec3 bMin, vec3 bMax) {
  vec3 invR = 1.0 / rd;
  vec3 t0 = (bMin - ro) * invR;
  vec3 t1 = (bMax - ro) * invR;
  vec3 tmin = min(t0, t1);
  vec3 tmax = max(t0, t1);
  float tN = max(max(tmin.x, tmin.y), tmin.z);
  float tF = min(min(tmax.x, tmax.y), tmax.z);
  return vec2(tN, tF);
}

// ── Komorebi (Swaying Overhanging Japanese Maple & Bamboo Canopy Shadow) ──
float komorebiFactor(vec3 P) {
  if (uKomorebi <= 0.001) return 1.0;
  vec2 halfBed = uBedSize * 0.5;
  // Project along sun ray up to canopy plane z = 195 cm
  vec2 cPos = P.xy + uSunDir.xy * ((195.0 - P.z) / max(uSunDir.z, 0.22));
  vec2 normP = cPos / halfBed;

  // Frame two graceful opposite garden corners so center stays clear and dramatic
  float cornerNW = smoothstep(0.18, 1.15, -normP.x * 0.72 + normP.y * 0.85 + 0.12);
  float cornerSE = smoothstep(0.26, 1.18,  normP.x * 0.68 - normP.y * 0.82 + 0.02);
  float canopyZone = clamp(max(cornerNW, cornerSE * 0.88), 0.0, 1.0);
  if (canopyZone < 0.01) return 1.0;

  // Gentle breeze sway
  float breeze = sin(uTime * 0.55 + cPos.x * 0.014) * 3.8 + sin(uTime * 1.18 + cPos.y * 0.022) * 1.5;
  vec2 wp = cPos * 0.036 + vec2(breeze * 0.065, cos(uTime * 0.42 + cPos.y * 0.018) * 0.14);

  // Layered dappled foliage gaps (sunbeams dancing through maple leaves)
  float f1 = fbm2(wp * 1.35);
  float f2 = vnoise2(wp * 3.4 + vec2(sin(uTime * 0.85) * 0.25, 4.1));
  float leaves = smoothstep(0.42, 0.68, f1 * 0.72 + f2 * 0.34);
  return 1.0 - leaves * canopyZone * uKomorebi;
}

// ── Unified Physically-Based Shadow (Sand Ridges + 3D Stones + Wooden Frame) ──
float computeShadow(vec3 P, int selfStone) {
  float sh = 1.0;

  // 1) Sand ridge self-shadowing (march heightfield toward sun)
  vec2 halfBed = uBedSize * 0.5;
  if (abs(P.x) < halfBed.x && abs(P.y) < halfBed.y && P.z < 4.5) {
    float t = 0.42;
    float maxT = (4.6 - P.z) / max(uSunDir.z, 0.14);
    maxT = min(maxT, 24.0);
    for (int s = 0; s < 18; s++) {
      if (t > maxT) break;
      vec3 sp = P + uSunDir * t;
      if (abs(sp.x) >= halfBed.x || abs(sp.y) >= halfBed.y) break;
      float hS = getSandH(sp.xy);
      float diff = sp.z - hS;
      if (diff < 0.0) {
        sh = 0.0;
        break;
      }
      sh = min(sh, clamp(4.8 * diff / t, 0.0, 1.0));
      t += mix(0.46, 1.65, float(s) / 17.0);
    }
  }
  if (sh < 0.02) return 0.0;

  // 2) 3D Stone cast soft penumbra shadows (fast bounding-sphere rejection)
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount) break;
    vec4 sA = uStoneA[i];
    vec4 sB = uStoneB[i];
    vec4 sC = uStoneC[i];
    float bR = max(sA.w * max(sB.x, sB.y), sB.z) * 1.18;
    vec3 bC = vec3(sA.xy, sB.z * 0.34 - sC.z);
    vec2 hit = intersectSphere(P, uSunDir, bC, bR);
    if (hit.x < hit.y && hit.y > 0.25) {
      float t = max(hit.x, (i == selfStone) ? 0.55 : 0.22);
      float tEnd = hit.y;
      for (int s = 0; s < 16; s++) {
        if (t > tEnd) break;
        float d = stoneSDF(P + uSunDir * t, i);
        if (d < 0.04) {
          sh = 0.0;
          break;
        }
        sh = min(sh, clamp(7.2 * d / t, 0.0, 1.0));
        t += clamp(d * 0.85, 0.35, 3.2);
      }
      if (sh < 0.02) return 0.0;
    }
  }

  // 3) Elevated wooden timber border cast shadow onto sand bed
  if (P.z < uFrameDim.y && abs(P.x) < halfBed.x && abs(P.y) < halfBed.y) {
    float tTop = (uFrameDim.y - P.z) / max(uSunDir.z, 0.08);
    vec2 hitXY = P.xy + uSunDir.xy * tTop;
    vec2 over = abs(hitXY) - halfBed;
    float edgeOut = max(over.x, over.y);
    if (edgeOut > -1.4) {
      float fw = smoothstep(-1.4, 1.4, edgeOut);
      // Softness widens with distance from timber rim
      sh = min(sh, 1.0 - fw * 0.92);
    }
  }

  return sh;
}

// ── Oren-Nayar Rough Matte Granular Diffuse ──
float orenNayar(vec3 N, vec3 L, vec3 V, float sigma) {
  float NdotL = max(dot(N, L), 0.0);
  if (NdotL <= 0.0) return 0.0;
  float NdotV = max(dot(N, V), 0.001);
  float s2 = sigma * sigma;
  float A = 1.0 - 0.5 * (s2 / (s2 + 0.33));
  float B = 0.45 * (s2 / (s2 + 0.09));
  vec3 Lp = normalize(L - N * NdotL + vec3(1e-5));
  vec3 Vp = normalize(V - N * NdotV + vec3(1e-5));
  float cosPhi = max(0.0, dot(Lp, Vp));
  float sinAlpha = sqrt(max(0.0, 1.0 - min(NdotL, NdotV) * min(NdotL, NdotV)));
  float tanBeta  = sqrt(max(0.0, 1.0 - max(NdotL, NdotV) * max(NdotL, NdotV))) / max(max(NdotL, NdotV), 0.001);
  return NdotL * (A + B * cosPhi * sinAlpha * tanBeta);
}

// ── Stone Contact AO & Moss Color Bleed onto Sand ──
vec2 sandStoneContact(vec3 P) {
  float ao = 1.0;
  float mossBleed = 0.0;
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount) break;
    vec4 sA = uStoneA[i];
    vec4 sB = uStoneB[i];
    vec4 sC = uStoneC[i];
    vec2 d = P.xy - sA.xy;
    float ca = cos(-sA.z);
    float sa = sin(-sA.z);
    vec2 q = vec2(ca * d.x - sa * d.y, sa * d.x + ca * d.y);
    vec2 rad = max(vec2(1.0), sA.w * sB.xy);
    vec2 n = q / rad;
    float k0 = length(n);
    float k1 = length(n / rad);
    float sd = k0 * (k0 - 1.0) / max(k1, 1e-4);
    float cAO = smoothstep(-0.5, 4.6, sd);
    ao *= mix(0.44, 1.0, cAO);
    mossBleed = max(mossBleed, (1.0 - smoothstep(0.0, 3.8, sd)) * sC.x * 0.22);
  }
  return vec2(ao, mossBleed);
}

// ── Photorealistic Shirakawa Granite Gravel Shading ──
vec3 shadeSand(vec3 P, vec3 V) {
  vec2 uv = worldToUv(P.xy);
  vec4 sand = sampleSand(uSandTex, uv);
  float h = sand.r;
  float fresh = sand.g;
  vec2 flow = sand.ba;
  float fl = length(flow);
  vec2 fDir = (fl > 0.05) ? (flow / fl) : vec2(1.0, 0.0);
  vec2 fPerp = vec2(-fDir.y, fDir.x);

  // Macro surface normal from heightfield central differences
  vec2 dCm = uTexel * uBedSize;
  float hL = sampleSand(uSandTex, uv - vec2(uTexel.x, 0.0)).r;
  float hR = sampleSand(uSandTex, uv + vec2(uTexel.x, 0.0)).r;
  float hD = sampleSand(uSandTex, uv - vec2(0.0, uTexel.y)).r;
  float hU = sampleSand(uSandTex, uv + vec2(0.0, uTexel.y)).r;
  vec3 Nmacro = normalize(vec3((hL - hR) / (2.0 * dCm.x), (hD - hU) / (2.0 * dCm.y), 1.0));

  // Fine combing striations aligned with wooden rake stroke direction
  float striaCoord = dot(P.xy, fPerp) * 5.8 + fbm2(P.xy * 0.25) * 1.4;
  float striaDeriv = cos(striaCoord) * 0.065 * clamp(fresh * 1.25, 0.15, 1.0);
  vec3 Ncombed = normalize(Nmacro + vec3(fPerp * striaDeriv, 0.0));

  // Multi-scale crushed Shirakawa granite pebbles (coarse 2.8mm + fine 1.1mm quartz matrix)
  // Slightly align coarse grain orientation along rake stroke
  vec2 pCoarse = P.xy * 3.45 + fDir * (sin(dot(P.xy, fPerp) * 2.2) * 0.06);
  vec2 slope1, slope2;
  vec3 g1 = pebbleInfo(pCoarse, slope1);
  vec3 g2 = pebbleInfo(P.xy * 8.6 + vec2(31.4, 17.8), slope2);

  // Authentic Kyoto Shirakawa-suna mineral composition per individual grain
  vec3 cQuartz   = vec3(0.84, 0.815, 0.775); // luminous warm white quartz
  vec3 cFeldspar = vec3(0.75, 0.705, 0.645); // soft pale warm feldspar
  vec3 cGranite  = vec3(0.61, 0.595, 0.570); // silver-grey granite grain
  vec3 cBiotite  = vec3(0.23, 0.225, 0.220); // crisp dark biotite mica fleck

  float m1 = g1.y;
  vec3 col1 = cQuartz;
  if (m1 > 0.90)      col1 = cBiotite;
  else if (m1 > 0.75) col1 = cGranite;
  else if (m1 > 0.48) col1 = cFeldspar;
  col1 *= (0.94 + 0.12 * g1.z);

  float m2 = g2.y;
  vec3 col2 = (m2 > 0.89) ? cBiotite * 1.15 : ((m2 > 0.52) ? cFeldspar : cQuartz);
  col2 *= (0.94 + 0.11 * g2.z);

  // Blend coarse pebbles & fine matrix + inter-pebble micro-cavity occlusion
  vec3 albedo = mix(col1, col2, 0.36);
  float grainCavity = mix(0.84, 1.04, smoothstep(0.0, 0.65, g1.x)) * mix(0.92, 1.03, g2.x);
  albedo *= grainCavity;

  // Subtle macro variation across courtyard (natural gravel bed density & subtle freshness)
  float macroVar = fbm2(P.xy * 0.025 + 5.2);
  albedo *= (0.94 + 0.11 * macroVar);
  // Freshly turned grooves show slightly brighter upturned dry mineral grains on ridges
  albedo *= (0.98 + 0.035 * fresh * clamp(h * 0.5 + 0.5, 0.0, 1.0));

  // Combine macro heightfield normal with individual pebble micro-facets
  vec3 N = normalize(Ncombed + vec3(slope1 * 0.26 + slope2 * 0.16, 0.0));

  // Heightfield trough Ambient Occlusion
  vec2 aoStep = uTexel * 4.5;
  float hAround = 0.25 * (
    sampleSand(uSandTex, uv + vec2(aoStep.x, 0.0)).r +
    sampleSand(uSandTex, uv - vec2(aoStep.x, 0.0)).r +
    sampleSand(uSandTex, uv + vec2(0.0, aoStep.y)).r +
    sampleSand(uSandTex, uv - vec2(0.0, aoStep.y)).r
  );
  float ridgeAO = clamp(1.0 - max(0.0, hAround - h) * 0.28, 0.56, 1.0);

  // Stone contact AO & wooden frame contact AO (recessed shadow reveal along dark timber lip)
  vec2 sc = sandStoneContact(P);
  vec2 halfBed = uBedSize * 0.5;
  float edgeDist = min(halfBed.x - abs(P.x), halfBed.y - abs(P.y));
  float frameAO = mix(0.32, 1.0, smoothstep(0.0, 4.6, edgeDist));
  float ao = ridgeAO * sc.x * frameAO;

  // Faint natural moss tint clinging right next to mossy stones
  albedo = mix(albedo, vec3(0.36, 0.42, 0.27), sc.y * 0.45);

  // Wetness response (Mist/Rain darkens granite & adds gentle specular sheen)
  float wetLocal = uWetness * (0.85 + 0.30 * (1.0 - clamp(h * 0.35 + 0.5, 0.0, 1.0)));
  albedo *= mix(1.0, 0.60, wetLocal);

  // Direct sunlight with unified sand/stone/frame shadows & Komorebi dappled canopy
  float shadow = computeShadow(P, -1);
  float komo = komorebiFactor(P);
  float directVis = shadow * komo;

  float diff = orenNayar(N, uSunDir, V, mix(0.84, 0.45, wetLocal));
  vec3 directLight = uSunColor * diff * directVis;

  // Sparse crystalline quartz & mica micro-glints on sunlit facets
  vec3 H = normalize(uSunDir + V);
  vec3 crystalN = normalize(Nmacro + vec3(slope1 * 0.62 + (vec2(g1.z, g2.z) - 0.5) * 0.55, 0.0));
  float glint = pow(max(dot(crystalN, H), 0.0), mix(140.0, 42.0, wetLocal));
  float micaBoost = (m1 > 0.90 || m1 < 0.14) ? 1.55 : 0.45;
  vec3 specLight = uSunColor * glint * mix(0.28, 0.56, wetLocal) * micaBoost * directVis;

  // Cool atmospheric skylight + warm sunlit sand-to-sand bounce inside troughs!
  vec3 skyAmb = uSkyColor * (0.48 + 0.52 * N.z) * ao * 0.54;
  float bounceMask = (1.0 - directVis * 0.78) * ao * (1.0 - 0.38 * N.z);
  vec3 sandBounce = uBounceColor * bounceMask * 0.17 * (0.65 + 0.35 * komo);

  // Subtle wet sky Fresnel reflection in Mist mode
  float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);
  vec3 wetSheen = uSkyColor * fresnel * wetLocal * 0.24 * ao;

  vec3 color = albedo * (directLight + skyAmb + sandBounce) + specLight + wetSheen;
  return color;
}

// ── Photorealistic 3D Weathered Kyoto Granite & Velvet Moss Shading ──
vec3 shadeStone(vec3 P, vec3 V, int idx) {
  vec4 sA = uStoneA[idx];
  vec4 sB = uStoneB[idx];
  vec4 sC = uStoneC[idx];
  float sd = sB.w;

  vec3 N = stoneNormal(P, idx);

  // Transform to stone-local coords for consistent texture when rotating/moving boulder!
  vec3 rel = P - vec3(sA.xy, -sC.z);
  float ca = cos(-sA.z);
  float sa = sin(-sA.z);
  vec3 lp = vec3(ca * rel.x - sa * rel.y, sa * rel.x + ca * rel.y, rel.z);
  vec3 q = lp / max(vec3(1.0), vec3(sA.w * sB.x, sA.w * sB.y, sB.z));

  // Fine mineral grain & fracture bump on granite
  float fMicro = fbm3(q * 11.5 + sd * 4.0);
  float fFine  = vnoise3(q * 28.0 + sd * 7.0);
  float fStrata = sin((q.x * 4.5 + q.y * 2.8 + q.z * 9.5) + fMicro * 3.2);
  float fCrack = smoothstep(0.08, 0.0, abs(fbm3(q * 5.2 + vec3(sd * 2.1, 1.3, 4.7)) - 0.5));

  // Perturb normal with fine fractured granite texture
  vec3 gBump = vec3(
    vnoise3(q * 24.0 + vec3(0.4, 0.0, 0.0)) - fFine,
    vnoise3(q * 24.0 + vec3(0.0, 0.4, 0.0)) - fFine,
    vnoise3(q * 24.0 + vec3(0.0, 0.0, 0.4)) - fFine
  );
  N = normalize(N + gBump * 0.32);

  // Kyoto Kurama / Kibune granite base color (deep slate charcoal + warm mineral iron veins)
  vec3 darkBasalt = vec3(0.145, 0.148, 0.152);
  vec3 midGranite = vec3(0.245, 0.242, 0.232);
  vec3 warmIron   = vec3(0.31,  0.265, 0.215);
  vec3 quartzVein = vec3(0.56,  0.545, 0.515);

  vec3 rockCol = mix(darkBasalt, midGranite, smoothstep(0.28, 0.72, fMicro));
  rockCol = mix(rockCol, warmIron, smoothstep(0.58, 0.85, fbm3(q * 3.8 + sd * 9.0)) * 0.42);
  // Hairline quartz mineral veins
  float vein = smoothstep(0.955, 0.992, abs(sin(q.x * 6.0 - q.z * 8.0 + fMicro * 4.2)));
  rockCol = mix(rockCol, quartzVein, vein * 0.45);
  // Subtle speckled crystalline sparkle
  rockCol *= (0.86 + 0.26 * fFine);
  // Darken fractures & stratified crevices
  rockCol *= (1.0 - fCrack * 0.36);
  rockCol *= (0.92 + 0.08 * fStrata);

  // Crustose pale grey-sage mountain lichen rosettes on sunlit upper shoulders
  float lichenNoise = fbm3(q * 7.8 + vec3(19.2, sd * 3.3, 8.1));
  float lichenMask = smoothstep(0.64, 0.76, lichenNoise) * smoothstep(0.25, 0.65, N.z) * (1.0 - fCrack);
  vec3 lichenCol = mix(vec3(0.48, 0.50, 0.44), vec3(0.62, 0.61, 0.53), fFine);
  rockCol = mix(rockCol, lichenCol, lichenMask * 0.62);

  // ── Velvety Kyoto Sugi-goke Moss ──
  // Clings organically to upward crevices, cool shaded flanks, and moist lower pockets
  float mossPatch = fbm3(q * 4.6 + vec3(sd * 5.7, 3.1, sd * 1.9));
  float mossFine  = vnoise3(q * 36.0 + sd * 2.0);
  float northBias = clamp(0.55 - dot(N.xy, normalize(uSunDir.xy + vec2(1e-4))) * 0.30, 0.2, 0.85);
  float heightProfile = smoothstep(-0.08, 0.14, q.z) * (1.0 - smoothstep(0.62, 1.05, q.z) * 0.45);
  float mossField = (N.z * 0.68 + northBias * 0.36 + (mossPatch - 0.5) * 0.72) * heightProfile;
  float mossThreshold = 1.02 - sC.x * 0.58;
  float mossMask = smoothstep(mossThreshold, mossThreshold + 0.16, mossField);

  // Plush multi-tone botanical moss palette
  vec3 mossDeep   = vec3(0.105, 0.165, 0.070);
  vec3 mossMid    = vec3(0.215, 0.300, 0.115);
  vec3 mossTip    = vec3(0.385, 0.465, 0.175);
  vec3 mossCol = mix(mossDeep, mossMid, smoothstep(0.25, 0.75, mossFine));
  mossCol = mix(mossCol, mossTip, smoothstep(0.55, 0.95, mossPatch * 0.65 + mossFine * 0.45));

  // Fuzzy normal jitter on moss cushions
  vec3 Nsurf = normalize(mix(N, normalize(N + (vec3(mossFine, fFine, mossPatch) - 0.5) * 0.55), mossMask));

  // Dusting of pale dry gravel clinging right at the sand-stone interface
  float localSandH = getSandH(P.xy);
  float hAboveSand = P.z - localSandH;
  float sandDust = (1.0 - smoothstep(0.0, 2.1, hAboveSand)) * (1.0 - mossMask * 0.7);
  vec3 albedo = mix(rockCol, mossCol, mossMask);
  albedo = mix(albedo, vec3(0.62, 0.59, 0.54), sandDust * 0.42);

  // Darken rock when wet in Mist mode (wet basalt gets rich, deep, glossy!)
  float wetRock = uWetness * (1.0 - mossMask * 0.65);
  albedo *= mix(1.0, 0.54, wetRock);

  // Lighting & unified shadows
  float shadow = computeShadow(P + N * 0.16, idx);
  float komo = komorebiFactor(P);
  float directVis = shadow * komo;

  float diff = orenNayar(Nsurf, uSunDir, V, mix(0.75, 0.92, mossMask));
  vec3 directLight = uSunColor * diff * directVis;

  // Subtle granite specular (stronger when wet) + velvet moss grazing-angle sheen!
  vec3 H = normalize(uSunDir + V);
  float rockSpecPow = mix(36.0, 96.0, wetRock);
  float rockSpec = pow(max(dot(Nsurf, H), 0.0), rockSpecPow) * mix(0.11, 0.38, wetRock) * (1.0 - mossMask);
  float fresnel = pow(1.0 - max(dot(Nsurf, V), 0.0), 3.0);
  // Plush translucent velvet sheen on sunlit moss tips
  vec3 mossSheen = mossTip * fresnel * mossMask * (uSunColor * directVis * 0.42 + uSkyColor * 0.25);

  // Ground contact AO + bright sand bounce light illuminating the stone's underside!
  float groundAO = smoothstep(-0.6, 4.5, hAboveSand);
  float cavityAO = mix(0.62, 1.0, groundAO) * (1.0 - fCrack * 0.32);
  vec3 skyAmb = uSkyColor * (0.35 + 0.65 * max(0.0, Nsurf.z)) * cavityAO * 0.68;
  // Bright gravel reflects warm bounce light onto the lower flanks of dark granite boulders
  float upwardBounce = clamp(0.42 - Nsurf.z * 0.55, 0.0, 1.0) * smoothstep(14.0, 0.0, hAboveSand);
  vec3 sandBounce = uBounceColor * upwardBounce * 0.34 * (0.45 + 0.55 * komo);

  vec3 col = albedo * (directLight + skyAmb + sandBounce) + uSunColor * rockSpec * directVis + mossSheen;

  // Subtle tactile rim feedback only when stone is actively hovered/grabbed in Stones mode
  if (sC.w > 0.01) {
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.4);
    col += vec3(0.88, 0.78, 0.58) * rim * sC.w * 0.55;
  }

  return col;
}

// ── Aged Hinoki / Dark Oiled Cedar Wooden Courtyard Frame ──
vec3 shadeWoodFrame(vec3 P, vec3 N, vec3 V) {
  vec2 halfBed = uBedSize * 0.5;
  // Determine mitered beam orientation (horizontal on top/bottom beams, vertical on left/right)
  vec2 over = abs(P.xy) - halfBed;
  bool isVerticalBeam = over.x > over.y;
  float miterDist = abs(over.x - over.y);
  float miterSeam = smoothstep(0.0, 0.38, miterDist);

  // Longitudinal wood-grain coordinates
  vec2 wp = isVerticalBeam ? vec2(P.x * 0.85, P.y * 0.095) : vec2(P.y * 0.85, P.x * 0.095);
  float warp = fbm2(wp * vec2(1.4, 2.2) + 4.1) * 3.2;
  float rings = sin(wp.x * 4.2 + warp);
  float grain = smoothstep(-0.85, 0.85, rings);
  float fineFiber = vnoise2(wp * vec2(22.0, 3.5));

  vec3 darkCedar  = vec3(0.105, 0.076, 0.056);
  vec3 warmHinoki = vec3(0.185, 0.135, 0.096);
  vec3 woodCol = mix(darkCedar, warmHinoki, grain * 0.72 + fineFiber * 0.28);

  // Darken miter joinery seam & weathered inner lip
  woodCol *= mix(0.42, 1.0, miterSeam);
  float innerDist = max(over.x, over.y);
  float bevelGlow = smoothstep(0.85, 0.0, abs(innerDist - 0.35));

  // Subtle wood fiber normal perturbation + soft beveled lip
  vec3 Nw = N;
  if (N.z > 0.5) {
    vec2 gSlope = isVerticalBeam ? vec2(cos(wp.x * 4.2 + warp) * 0.07, 0.0) : vec2(0.0, cos(wp.x * 4.2 + warp) * 0.07);
    Nw = normalize(N + vec3(gSlope, 0.0));
  }

  float komo = komorebiFactor(P);
  float sh = computeShadow(P + N * 0.15, -1);
  float vis = sh * komo;

  float diff = orenNayar(Nw, uSunDir, V, 0.58);
  vec3 H = normalize(uSunDir + V);
  float spec = pow(max(dot(Nw, H), 0.0), mix(34.0, 72.0, uWetness)) * mix(0.12, 0.30, uWetness);

  // Subtle recessed edge AO near the sand floor on vertical inner walls
  float wallAO = (N.z < 0.5) ? smoothstep(-0.8, 3.8, P.z) * 0.65 + 0.35 : 1.0;

  vec3 col = woodCol * (uSunColor * diff * vis + uSkyColor * (0.35 + 0.55 * max(0.0, Nw.z)) * 0.58 * wallAO)
           + uSunColor * (spec + bevelGlow * 0.05 * max(0.0, dot(N, uSunDir))) * vis;
  return col;
}

// ── Outer Dark Temple Slate Courtyard Apron ──
vec3 shadeCourtyard(vec3 P, vec3 V) {
  vec2 halfOut = uBedSize * 0.5 + uFrameDim.x;
  vec2 dOut = max(abs(P.xy) - halfOut, vec2(0.0));
  float distFrame = length(dOut);

  // Large dark weathered Kyoto basalt stone slabs
  vec2 tile = P.xy / 38.0;
  vec2 tileF = fract(tile);
  float grout = smoothstep(0.0, 0.032, min(min(tileF.x, 1.0 - tileF.x), min(tileF.y, 1.0 - tileF.y)));
  float tileTone = 0.88 + 0.22 * hash12(floor(tile));
  float n1 = fbm2(P.xy * 0.12);
  float n2 = vnoise2(P.xy * 1.4);

  vec3 slate = vec3(0.072, 0.070, 0.066) * tileTone * (0.82 + 0.32 * n1) * (0.92 + 0.14 * n2);
  slate *= mix(0.45, 1.0, grout);
  slate *= mix(1.0, 0.68, uWetness);

  // Soft shadow cast by outer timber frame onto the stone courtyard
  vec2 hitTop = P.xy + uSunDir.xy * ((uFrameDim.y - P.z) / max(uSunDir.z, 0.1));
  vec2 insideOut = halfOut - abs(hitTop);
  float frameCast = smoothstep(-1.2, 1.5, min(insideOut.x, insideOut.y));
  float sh = 1.0 - frameCast * 0.85;
  float komo = komorebiFactor(P);
  float ao = mix(0.42, 1.0, smoothstep(0.0, 7.5, distFrame));

  vec3 N = normalize(vec3((n2 - 0.5) * 0.08, (n1 - 0.5) * 0.08, 1.0));
  float diff = orenNayar(N, uSunDir, V, 0.70);
  vec3 H = normalize(uSunDir + V);
  float spec = pow(max(dot(N, H), 0.0), 40.0) * mix(0.06, 0.22, uWetness) * sh * komo;

  return slate * (uSunColor * diff * sh * komo + uSkyColor * 0.55 * ao) + uSunColor * spec;
}

// ── Filmic ACES Tone Mapping ──
vec3 acesToneMap(vec3 x) {
  const float a = 2.51;
  const float b = 0.03;
  const float c = 2.43;
  const float d = 0.59;
  const float e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamForward + uCamRight * (ndc.x * uAspect * uTanHalfFov) + uCamUp * (ndc.y * uTanHalfFov));
  vec3 V = -rd;

  vec2 halfBed = uBedSize * 0.5;
  vec2 halfOut = halfBed + uFrameDim.x;

  // 1) Intersect wooden courtyard frame (hollow rectangular rim from z=-1.2 to z=uFrameDim.y)
  float tHit = 1e6;
  int hitType = 0; // 0=courtyard, 1=sand, 2=wood, 3=stone
  vec3 hitPos = vec3(0.0);
  vec3 hitNorm = vec3(0.0, 0.0, 1.0);
  int hitStoneIdx = -1;

  // Intersect outer courtyard plane (z = -1.2 cm)
  float tApron = (-1.2 - ro.z) / rd.z;
  if (tApron > 0.0) {
    tHit = tApron;
    hitPos = ro + rd * tApron;
    hitType = 0;
  }

  // Intersect 4 wooden frame bars cleanly (outer box minus inner gravel cavity)
  vec2 boxOut = intersectBox(ro, rd, vec3(-halfOut, -1.5), vec3(halfOut, uFrameDim.y));
  if (boxOut.x < boxOut.y && boxOut.y > 0.0) {
    // Check top face of wood frame (z = uFrameDim.y)
    float tWoodTop = (uFrameDim.y - ro.z) / rd.z;
    if (tWoodTop > 0.0 && tWoodTop < tHit) {
      vec3 pTop = ro + rd * tWoodTop;
      if (abs(pTop.x) <= halfOut.x && abs(pTop.y) <= halfOut.y &&
         (abs(pTop.x) >= halfBed.x || abs(pTop.y) >= halfBed.y)) {
        tHit = tWoodTop;
        hitPos = pTop;
        hitNorm = vec3(0.0, 0.0, 1.0);
        hitType = 2;
      }
    }
    // Check inner vertical walls of wood frame facing into the sand bed
    float tWallYPos = (halfBed.y - ro.y) / rd.y;
    if (tWallYPos > 0.0 && tWallYPos < tHit) {
      vec3 pW = ro + rd * tWallYPos;
      if (abs(pW.x) <= halfBed.x && pW.z >= -1.5 && pW.z <= uFrameDim.y) {
        tHit = tWallYPos;
        hitPos = pW;
        hitNorm = vec3(0.0, -1.0, 0.0);
        hitType = 2;
      }
    }
    float tWallYNeg = (-halfBed.y - ro.y) / rd.y;
    if (tWallYNeg > 0.0 && tWallYNeg < tHit) {
      vec3 pW = ro + rd * tWallYNeg;
      if (abs(pW.x) <= halfBed.x && pW.z >= -1.5 && pW.z <= uFrameDim.y) {
        tHit = tWallYNeg;
        hitPos = pW;
        hitNorm = vec3(0.0, 1.0, 0.0);
        hitType = 2;
      }
    }
    float tWallXPos = (halfBed.x - ro.x) / rd.x;
    if (tWallXPos > 0.0 && tWallXPos < tHit) {
      vec3 pW = ro + rd * tWallXPos;
      if (abs(pW.y) <= halfBed.y && pW.z >= -1.5 && pW.z <= uFrameDim.y) {
        tHit = tWallXPos;
        hitPos = pW;
        hitNorm = vec3(-1.0, 0.0, 0.0);
        hitType = 2;
      }
    }
    float tWallXNeg = (-halfBed.x - ro.x) / rd.x;
    if (tWallXNeg > 0.0 && tWallXNeg < tHit) {
      vec3 pW = ro + rd * tWallXNeg;
      if (abs(pW.y) <= halfBed.y && pW.z >= -1.5 && pW.z <= uFrameDim.y) {
        tHit = tWallXNeg;
        hitPos = pW;
        hitNorm = vec3(1.0, 0.0, 0.0);
        hitType = 2;
      }
    }
    // Check outer front wall of frame facing camera (-Y)
    float tOutYNeg = (-halfOut.y - ro.y) / rd.y;
    if (tOutYNeg > 0.0 && tOutYNeg < tHit) {
      vec3 pW = ro + rd * tOutYNeg;
      if (abs(pW.x) <= halfOut.x && pW.z >= -1.5 && pW.z <= uFrameDim.y) {
        tHit = tOutYNeg;
        hitPos = pW;
        hitNorm = vec3(0.0, -1.0, 0.0);
        hitType = 2;
      }
    }
  }

  // 2) Raymarch Sand Heightfield (True 3D Relief Parallax)
  float tTop = (4.8 - ro.z) / rd.z;
  float tBot = (-3.8 - ro.z) / rd.z;
  if (tBot > 0.0 && tTop < tHit) {
    float tStart = max(0.0, tTop);
    float tEnd = min(tBot, tHit);
    vec3 pMid = ro + rd * ((tStart + tEnd) * 0.5);
    if (abs(pMid.x) <= halfBed.x + 4.0 && abs(pMid.y) <= halfBed.y + 4.0) {
      const int STEPS = 12;
      float dt = (tEnd - tStart) / float(STEPS);
      float prevT = tStart;
      float currT = tStart;
      bool found = false;
      for (int s = 0; s <= STEPS; s++) {
        currT = tStart + float(s) * dt;
        vec3 p = ro + rd * currT;
        if (abs(p.x) <= halfBed.x && abs(p.y) <= halfBed.y) {
          float hs = getSandH(p.xy);
          if (p.z <= hs) {
            found = true;
            break;
          }
        }
        prevT = currT;
      }
      if (found) {
        // 4 binary refinement steps for sub-millimeter ridge crispness
        float lo = prevT;
        float hi = currT;
        for (int b = 0; b < 4; b++) {
          float mid = 0.5 * (lo + hi);
          vec3 pm = ro + rd * mid;
          if (pm.z <= getSandH(pm.xy)) hi = mid;
          else lo = mid;
        }
        vec3 pSand = ro + rd * hi;
        if (abs(pSand.x) <= halfBed.x && abs(pSand.y) <= halfBed.y && hi < tHit) {
          tHit = hi;
          hitPos = pSand;
          hitType = 1;
        }
      }
    }
  }

  // 3) Raymarch 3D Sculptural Zen Boulders (tight bounding-sphere acceleration!)
  for (int i = 0; i < ${MAX_STONES}; i++) {
    if (i >= uStoneCount) break;
    vec4 sA = uStoneA[i];
    vec4 sB = uStoneB[i];
    vec4 sC = uStoneC[i];
    float bR = max(sA.w * max(sB.x, sB.y), sB.z) * 1.18;
    vec3 bC = vec3(sA.xy, sB.z * 0.34 - sC.z);
    vec2 sp = intersectSphere(ro, rd, bC, bR);
    if (sp.x < sp.y && sp.y > 0.0 && sp.x < tHit) {
      float t = max(0.0, sp.x);
      float tMax = min(sp.y, tHit);
      float prevD = 1e5;
      float prevT = t;
      for (int m = 0; m < 36; m++) {
        vec3 p = ro + rd * t;
        float d = stoneSDF(p, i);
        if (d < 0.05) {
          // Refine silhouette edge cleanly
          float lo = prevT;
          float hi = t;
          for (int b = 0; b < 3; b++) {
            float mid = 0.5 * (lo + hi);
            if (stoneSDF(ro + rd * mid, i) < 0.0) hi = mid;
            else lo = mid;
          }
          vec3 pStone = ro + rd * hi;
          if (hi < tHit) {
            tHit = hi;
            hitPos = pStone;
            hitType = 3;
            hitStoneIdx = i;
          }
          break;
        }
        prevD = d;
        prevT = t;
        t += max(d * 0.72, 0.22);
        if (t > tMax) break;
      }
    }
  }

  // 4) Shade Winning Surface
  vec3 color;
  if (hitType == 1) {
    color = shadeSand(hitPos, V);
  } else if (hitType == 3) {
    color = shadeStone(hitPos, V, hitStoneIdx);
  } else if (hitType == 2) {
    color = shadeWoodFrame(hitPos, hitNorm, V);
  } else {
    color = shadeCourtyard(hitPos, V);
  }

  // Subtle Kyoto atmospheric depth & soft optical vignette
  float vig = 1.0 - dot(ndc * vec2(0.75, 0.92), ndc * vec2(0.75, 0.92)) * 0.16;
  color *= vig;

  // Exposure + ACES Filmic Tone Mapping + sRGB Gamma
  color = acesToneMap(color * uExposure);
  color = pow(max(color, vec3(0.0)), vec3(1.0 / 2.2));

  // Micro film dithering eliminates any 8-bit sky/shadow gradient banding
  float dither = (hash12(gl_FragCoord.xy + fract(uTime) * 17.0) - 0.5) / 255.0;
  fragColor = vec4(color + dither, 1.0);
}
`;

  /* ==========================================================================
   * 4. WEBGL2 PROGRAM, FBO & UNDO RING BUFFER SETUP
   * ========================================================================== */
  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(sh));
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  function createProgram(vsSrc, fsSrc) {
    const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      throw new Error(gl.getProgramInfoLog(prog));
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  const progPreset = createProgram(QUAD_VS, PRESET_FS);
  const progRake   = createProgram(QUAD_VS, RAKE_FS);
  const progRelax  = createProgram(QUAD_VS, RELAX_FS);
  const progRender = createProgram(QUAD_VS, RENDER_FS);

  function getUniforms(prog, names) {
    const map = {};
    for (const n of names) map[n] = gl.getUniformLocation(prog, n);
    return map;
  }

  const uPreset = getUniforms(progPreset, [
    'uBedSize', 'uPreset', 'uStoneCount', 'uStoneA', 'uStoneB'
  ]);
  const uRake = getUniforms(progRake, [
    'uSandTex', 'uBedSize', 'uP0', 'uP1', 'uN0', 'uN1',
    'uMode', 'uTineCount', 'uSpacing', 'uHalfW', 'uDepth', 'uStrength', 'uTime',
    'uStoneCount', 'uStoneA', 'uStoneB', 'uActiveStone'
  ]);
  const uRelax = getUniforms(progRelax, [
    'uSandTex', 'uBedSize', 'uTexel', 'uRate'
  ]);
  const uRender = getUniforms(progRender, [
    'uSandTex', 'uBedSize', 'uTexel', 'uFrameDim', 'uResolution', 'uTime',
    'uCamPos', 'uCamForward', 'uCamRight', 'uCamUp', 'uTanHalfFov', 'uAspect',
    'uSunDir', 'uSunColor', 'uSkyColor', 'uBounceColor', 'uWetness', 'uExposure', 'uKomorebi',
    'uStoneCount', 'uStoneA', 'uStoneB', 'uStoneC'
  ]);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  function createSimTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const intFmt = USE_FLOAT_FBO ? gl.RGBA16F : gl.RGBA8;
    const type   = USE_FLOAT_FBO ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
    const filt   = USE_FLOAT_FBO ? gl.LINEAR : gl.NEAREST;
    gl.texImage2D(gl.TEXTURE_2D, 0, intFmt, w, h, 0, gl.RGBA, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }

  let sandA = null;
  let sandB = null;
  const MAX_UNDO = 10;
  let undoStack = []; // { target, stones }

  function destroySimTarget(t) {
    if (!t) return;
    gl.deleteFramebuffer(t.fbo);
    gl.deleteTexture(t.tex);
  }

  function clearUndoStack() {
    for (const item of undoStack) destroySimTarget(item.target);
    undoStack = [];
  }

  function copySandTarget(src, dst) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dst.fbo);
    gl.blitFramebuffer(0, 0, src.w, src.h, 0, 0, dst.w, dst.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }

  function pushUndoSnapshot() {
    if (!sandA) return;
    let target;
    if (undoStack.length >= MAX_UNDO) {
      const oldest = undoStack.shift();
      target = oldest.target;
    } else {
      target = createSimTarget(world.simW, world.simH);
    }
    copySandTarget(sandA, target);
    const stonesCopy = state.stones.map(s => ({ ...s }));
    undoStack.push({ target, stones: stonesCopy });
  }

  function performUndo() {
    if (!undoStack.length || !sandA) return;
    const snap = undoStack.pop();
    copySandTarget(snap.target, sandA);
    destroySimTarget(snap.target);
    state.stones = snap.stones;
    state.settleFrames = 4;
    showBanner('Undid last change');
  }

  /* ==========================================================================
   * 5. STONE COMPOSITIONS & UNIFORM PACKING
   * ========================================================================== */
  const stoneBufA = new Float32Array(MAX_STONES * 4);
  const stoneBufB = new Float32Array(MAX_STONES * 4);
  const stoneBufC = new Float32Array(MAX_STONES * 4);

  function packStoneUniforms() {
    const count = Math.min(state.stones.length, MAX_STONES);
    for (let i = 0; i < count; i++) {
      const s = state.stones[i];
      const o = i * 4;
      stoneBufA[o]     = s.x;
      stoneBufA[o + 1] = s.y;
      stoneBufA[o + 2] = s.rot;
      stoneBufA[o + 3] = s.r;

      stoneBufB[o]     = s.ax;
      stoneBufB[o + 1] = s.ay;
      stoneBufB[o + 2] = s.hz;
      stoneBufB[o + 3] = s.seed;

      const isHi = (state.tool === 'stone' && (i === state.hoveredStone || i === state.grabbedStone))
        ? (i === state.grabbedStone ? 1.0 : 0.65) : 0.0;
      stoneBufC[o]     = s.moss;
      stoneBufC[o + 1] = s.flat;
      stoneBufC[o + 2] = s.sink;
      stoneBufC[o + 3] = isHi;
    }
  }

  function buildPresetStones(name) {
    const sx = world.bedW * 0.5;

    if (name === 'ryoanji') {

        // Companion low reclining stone beside guardian
        { x: -sx * 0.27, y:  sy * 0.02, rot: -0.52, r: 10.5 * k, ax: 1.25, ay: 0.78, hz: 10.2 * k, seed: 3.17, moss: 0.68, flat: 0.62, sink: 1.8 },
        // Third smaller triad anchor stone
        { x: -sx * 0.49, y: -sy * 0.09, rot: 1.15, r: 8.2 * k,  ax: 1.05, ay: 0.88, hz: 9.0 * k,  seed: 5.84, moss: 0.74, flat: 0.35, sink: 1.5 },
        // Right-lower serene pair
        { x:  sx * 0.35, y: -sy * 0.14, rot: -0.28, r: 14.2 * k, ax: 1.28, ay: 0.80, hz: 15.8 * k, seed: 7.29, moss: 0.76, flat: 0.48, sink: 2.0 },
        { x:  sx * 0.48, y: -sy * 0.01, rot: 0.82, r: 9.2 * k,  ax: 1.10, ay: 0.85, hz: 11.4 * k, seed: 9.61, moss: 0.58, flat: 0.25, sink: 1.6 }

        { x:  sx * 0.08, y:  sy * 0.22, rot: -0.65, r: 11.2 * k, ax: 1.15, ay: 0.88, hz: 13.8 * k, seed: 6.44, moss: 0.70, flat: 0.32, sink: 1.8 },
        { x:  sx * 0.38, y: -sy * 0.16, rot: 0.94, r: 12.6 * k, ax: 1.22, ay: 0.82, hz: 12.0 * k, seed: 8.15, moss: 0.84, flat: 0.58, sink: 1.8 }

        { x:  sx * 0.38, y: -sy * 0.08, rot: -0.40, r: 13.0 * k, ax: 1.12, ay: 0.88, hz: 17.5 * k, seed: 7.92, moss: 0.72, flat: 0.28, sink: 2.0 }

        { x:  sx * 0.46, y: -sy * 0.28, rot: -0.75, r: 10.0 * k, ax: 1.14, ay: 0.88, hz: 11.5 * k, seed: 5.27, moss: 0.65, flat: 0.48, sink: 1.6 }
